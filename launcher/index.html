<script>
/* Theme before first paint (the only other script; the main one is at the end):
   night between 20:00 and 08:00 unless the owner chose Clair / Sombre. */
(function () {
  var m = 'auto', h = new Date().getHours();
  try { m = JSON.parse(localStorage.getItem('tvlauncher.v1.theme')) || 'auto'; } catch (e) { /* default */ }
  if (m === 'dark' || (m !== 'light' && (h >= 20 || h < 8))) document.documentElement.className = 'dark';
})();
</script>
<!--
  Lanceur TV, version 2: one file, no dependencies.
  The only network use is the local WebSocket ws://127.0.0.1:8766/ws and,
  when the server lists them, app icons at local relative URLs (/icons/N.png).
  Target: Hisense / VIDAA, Chromium 111. Syntax: ES2018, one plain <script>.

  Design: a console-style channel menu on pale silver.
  - 4 x 3 landscape (4:3) channels per page; pages turn sideways.
  - The artwork fills each channel; the name is written on it, top-left, in
    white over a light dark gradient. Thin white bevel, rounded corners.
  - Empty cells show faint embossed placeholders.
  - A light metallic bar along the bottom, under a curved line, holds the
    clock and date, the status, and two round buttons (home, settings).
  - Inputs (TV, HDMI 1-4) are the first channels of page 1, drawn like apps:
    artwork (or monogram), name, signal pill, "en cours" / "dernière" tag.
  - Réglages: system-settings style. Category tiles on the left, a large
    panel of rows on the right (6 pooled rows per page), Retour / OK below.

  Rendering: no fixed stage and no global scale. Every size is in rem, and
  the root font size follows the real viewport:
      1rem = 10 "design pixels" of a 1920x1080 screen = min(100vw/192, 100vh/108)
  so the page is laid out and rasterised at the device's own resolution.
  Single short shadows, no blur filters, no will-change, no backdrop-filter.

  /* ================================================================== */
  /* Root unit and tokens                                                */
  /* ================================================================== */
  html { font-size: 10px; font-size: min(0.5208333vw, 0.9259259vh); }
  :root {
    --ink: #2b323c;            /* main text, about 11:1 on silver */
    --ink-soft: #555d69;       /* secondary text, about 5.5:1 */
    --blue: #2c9be0;           /* focus and accents */
    --glow: rgba(64, 170, 240, 0.6);
    --ok: #3a9f62;
    --warn: #d08a1e;
    --font: "Wii", "Nunito", "Varela Round", "Segoe UI", "Trebuchet MS", "Noto Sans", Roboto,
            "Droid Sans", "Helvetica Neue", Verdana, Arial, sans-serif;
    --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
    /* Channel geometry (rem): must match the constants in the script. */
    --ch-w: 40rem; --ch-h: 22.6rem; --gap: 2.2rem; --win-pad: 3rem;
    --r-ch: 2.6rem;   /* = R_OUT in make_frame.py */
    /* Pale silver: a smooth vertical gradient with one soft sheen, no lines. */
    --silver:
      url(/icons/scan.png),
      radial-gradient(130rem 46rem at 50% 16%, var(--bg-sheen), rgba(255, 255, 255, 0) 70%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
    --silver-size: 100% 3px, auto, auto;
    /* Theme tokens. Light (day) values here; html.dark redefines the same
       variables for the night. Nothing else changes between the themes. */
    --bg: #e9ebee; --bg-sheen: rgba(255, 255, 255, 0.6);
    --bg-top: #f2f3f5; --bg-mid: #e9ebee; --bg-bot: #dfe2e6;
    --lift: rgba(40, 60, 90, 0.28);
    --chrome: #4a525e; --clock: #737a84; --clock-shadow: #fff; --date: #4f5763; --date-shadow: rgba(255, 255, 255, 0.55);
    --ver: rgba(60, 80, 100, 0.45);
    --card-base: #fff;
    --card: linear-gradient(180deg, #ffffff 0%, #fbfbfc 46%, #eff1f3 54%, #f6f7f8 100%);
    --card-ink: #4b5562; --card-ink-shadow: #fff; --card-pill: rgba(70, 85, 105, 0.12); --card-pill-dot: rgba(70, 85, 105, 0.55);
    --mono-mix: 100%; --mono-shadow: 0 0.15rem 0 #fff, 0 -0.1rem 0 rgba(0, 0, 0, 0.12);
    --scan-op: 0.35; --glass-op: 0.55;
    --ph-bg: linear-gradient(180deg, #e2e4e7 0%, #dcdfe2 100%);
    --ph-shadow: inset 0 0.15rem 0.25rem rgba(60, 70, 85, 0.1), inset 0 -0.12rem 0 rgba(255, 255, 255, 0.75),
                 0 0 0 0.12rem rgba(150, 158, 170, 0.22), 0 0.12rem 0 0.12rem rgba(255, 255, 255, 0.85);
    --ph-mark: rgba(255, 255, 255, 0.5);
    --metal-1: #d9dce1; --metal-2: #d1d4da; --metal-3: #c6cad1; --metal-4: #dde0e5;
    --metal-shade: #2f3a4c; --metal-shade-op: 0.045; --metal-hi1: 0.4; --metal-hi2: 0.5; --metal-lip: 0.9;
    --cyan: #3fb4e8;
    --orb-bg: radial-gradient(circle at 50% 30%, #ffffff 0%, #f3f4f6 50%, #d9dce1 100%); --orb-ink: #4a8fc4;
    --orb-socket: 0 0.2rem 0.35rem rgba(40, 55, 80, 0.3), 0 0 0 1.1rem rgba(235, 237, 241, 0.55),
                  0 0 0 1.25rem rgba(120, 128, 140, 0.22), 0 0.25rem 0 1.25rem rgba(255, 255, 255, 0.45);
    --pill-bg: rgba(255, 255, 255, 0.85); --pill-off-bg: #fff3e0; --pill-off-ink: #7a4f0e;
    --dots: rgba(60, 70, 85, 0.22);
    --toast-bg: #2b323c; --toast-ink: #fff; --tag-bg: #fff; --tag-ink: #2b323c;
    --plate: linear-gradient(180deg, #ffffff, #eef0f3); --plate-edge: #fff;
    --sel-fill: linear-gradient(180deg, #e8f5fe, #c4e3f8);
    --cat-bg: linear-gradient(180deg, #ffffff 0%, #f3f5f7 60%, #e6e9ed 100%); --cat-edge: #d3d9e0;
    --pic-bg: radial-gradient(circle at 50% 35%, #ffffff 0%, #eef1f4 60%, #dde2e7 100%); --pic-edge: #bfe0f4; --pic-ink: #3f8fcf;
    --cat-sel-bg: linear-gradient(180deg, #f4faff, #d9edfb); --cat-sel-edge: #7cc4ef;
    --warn-ink: #8a560e; --on-ink: #1b6aa5; --armed-ink: #a8402c;
    --panel-bg: rgba(255, 255, 255, 0.72); --panel-edge: #fff;
    --badge-bg: rgba(44, 155, 224, 0.15); --badge-ink: #1b5f8f;
    --chip-bg: #fff; --chip-edge: #d6dce3;
    --row-bg: linear-gradient(180deg, #ffffff, #eff1f4); --row-edge: #d6dce3; --ico-edge: #fff;
    --sw-track: rgba(40, 50, 65, 0.2);
    --smetal-1: #f7f8f9; --smetal-2: #e8eaed;
    --smetal-body: linear-gradient(180deg, #e8eaed 0%, #d9dce1 65%, #c9cdd4 100%); --smetal-lip: rgba(255, 255, 255, 0.8);
    --smetal-foot: linear-gradient(180deg, #e6e8eb, #f0f1f3); --scyan: #6cc6ee;
    --btn-bg: linear-gradient(180deg, #ffffff, #e9ecef);
    --btn-round: radial-gradient(circle at 50% 35%, #ffffff 0%, #f1f3f5 55%, #dde1e5 100%);
    --btn-edge: #9fd6f2; --btn-ink: #2f78b0;
  }
  /* Night: deep blue-grey (not black), dark metal, off-white text; the same
     tiles, rims, glass and cyan line. Only variables. */
  html.dark {
    --ink: #e6ebf1; --ink-soft: #aeb7c3;
    --bg: #1d2430; --bg-sheen: rgba(110, 150, 200, 0.1);
    --bg-top: #283241; --bg-mid: #1f2733; --bg-bot: #19202a;
    --lift: rgba(0, 0, 0, 0.5);
    --chrome: #b4bdc9; --clock: #c9d0d9; --clock-shadow: rgba(0, 0, 0, 0.45); --date: #d8dee6; --date-shadow: rgba(0, 0, 0, 0.4);
    --ver: rgba(200, 215, 235, 0.35);
    --card-base: #2a3340;
    --card: linear-gradient(180deg, #3a4452 0%, #333d4a 46%, #2b3440 54%, #303a46 100%);
    --card-ink: #dfe5ec; --card-ink-shadow: rgba(0, 0, 0, 0.45); --card-pill: rgba(255, 255, 255, 0.1); --card-pill-dot: rgba(255, 255, 255, 0.5);
    --mono-mix: 45%; --mono-shadow: 0 0.15rem 0.2rem rgba(0, 0, 0, 0.35);
    --scan-op: 0.5; --glass-op: 0.85;
    --ph-bg: linear-gradient(180deg, #232c38 0%, #1f2731 100%);
    --ph-shadow: inset 0 0.15rem 0.25rem rgba(0, 0, 0, 0.35), inset 0 -0.12rem 0 rgba(255, 255, 255, 0.05),
                 0 0 0 0.12rem rgba(255, 255, 255, 0.06), 0 0.12rem 0 0.12rem rgba(255, 255, 255, 0.04);
    --ph-mark: rgba(255, 255, 255, 0.08);
    --metal-1: #303946; --metal-2: #29313d; --metal-3: #212832; --metal-4: #343e4b;
    --metal-shade: #000; --metal-shade-op: 0.09; --metal-hi1: 0.05; --metal-hi2: 0.08; --metal-lip: 0.18;
    --cyan: #4cc0f0;
    --orb-bg: radial-gradient(circle at 50% 30%, #4a5565 0%, #343e4b 50%, #262e39 100%); --orb-ink: #8fd0f5;
    --orb-socket: 0 0.2rem 0.35rem rgba(0, 0, 0, 0.5), 0 0 0 1.1rem rgba(255, 255, 255, 0.04),
                  0 0 0 1.25rem rgba(0, 0, 0, 0.35), 0 0.25rem 0 1.25rem rgba(255, 255, 255, 0.05);
    --pill-bg: rgba(255, 255, 255, 0.09); --pill-off-bg: rgba(208, 138, 30, 0.18); --pill-off-ink: #f2c47e;
    --dots: rgba(255, 255, 255, 0.22);
    --toast-bg: #e6ebf1; --toast-ink: #1d2430; --tag-bg: #dfe5ec; --tag-ink: #1d2430;
    --plate: linear-gradient(180deg, #303a47, #28313c); --plate-edge: #3b4553;
    --sel-fill: linear-gradient(180deg, #2c4c6a, #22405c);
    --cat-bg: linear-gradient(180deg, #313b48 0%, #2b3440 60%, #252d38 100%); --cat-edge: #3b4553;
    --pic-bg: radial-gradient(circle at 50% 35%, #44505f 0%, #343e4b 60%, #2a323d 100%); --pic-edge: #3f6f93; --pic-ink: #8fd0f5;
    --cat-sel-bg: linear-gradient(180deg, #2a4a66, #213c55); --cat-sel-edge: #4aa6dd;
    --warn-ink: #f2c47e; --on-ink: #8fd0f5; --armed-ink: #ff9a85;
    --panel-bg: rgba(255, 255, 255, 0.04); --panel-edge: #343e4b;
    --badge-bg: rgba(64, 170, 240, 0.18); --badge-ink: #9fd8f8;
    --chip-bg: #29323d; --chip-edge: #3e4856;
    --row-bg: linear-gradient(180deg, #313b48, #2a333f); --row-edge: #3e4856; --ico-edge: #3e4856;
    --sw-track: rgba(255, 255, 255, 0.16);
    --smetal-1: #303946; --smetal-2: #29313d;
    --smetal-body: linear-gradient(180deg, #29313d 0%, #232a34 65%, #1c222b 100%); --smetal-lip: rgba(255, 255, 255, 0.08);
    --smetal-foot: linear-gradient(180deg, #171d25, #141920); --scyan: #4cc0f0;
    --btn-bg: linear-gradient(180deg, #3a4452, #2c3542);
    --btn-round: radial-gradient(circle at 50% 35%, #4a5565 0%, #364050 55%, #283039 100%);
    --btn-edge: #3f7fa8; --btn-ink: #9fd8f8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { color: var(--ink); font-family: var(--font); font-size: 2.4rem; line-height: 1.3;
         -webkit-font-smoothing: antialiased; background-color: var(--bg); background-image: var(--silver); background-size: var(--silver-size); }
  button { font: inherit; color: inherit; background: none; border: 0; text-align: left; cursor: pointer; }
  :focus { outline: none; }
  .spacer { flex: 1; }

  /* ================================================================== */
  /* Shared focus: a soft lift shadow (::before) and a white border with */
  /* a blue glow (::after). Only opacity and transform animate.          */
  /* ================================================================== */
  .nav { position: relative; transition: transform 220ms var(--ease); }
  .nav::before, .nav::after { content: ""; position: absolute; pointer-events: none; opacity: 0; transition: opacity 200ms linear; }
  .nav::before { left: 0; top: 0; right: 0; bottom: 0; border-radius: inherit; box-shadow: 0 0.8rem 1.4rem var(--lift); }
  .nav::after { left: -0.5rem; top: -0.5rem; right: -0.5rem; bottom: -0.5rem; border-radius: 1.6rem;
                border: 0.4rem solid #fff; box-shadow: 0 0 1.4rem 0.3rem var(--glow); }
  .nav:focus::before, .nav:focus::after { opacity: 1; }
  .nav > * { position: relative; z-index: 1; }

  /* ================================================================== */
  /* Home                                                                */
  /* ================================================================== */
  #home { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 1; }

  /* The page window: one page of 4 x 3, with room for the lift and glow. */
  .window { position: absolute; left: 50%; top: 3.4rem; overflow: hidden;
            width: calc(4 * var(--ch-w) + 3 * var(--gap) + 2 * var(--win-pad));
            height: calc(3 * var(--ch-h) + 2 * var(--gap) + 2 * var(--win-pad));
            margin-left: calc(-2 * var(--ch-w) - 1.5 * var(--gap) - var(--win-pad));
            padding: var(--win-pad); }
  /* Pages sit side by side; each item gets its column/row from the script. */
  .grid { display: grid; grid-auto-columns: var(--ch-w); grid-template-rows: repeat(3, var(--ch-h)); gap: var(--gap);
          transition: transform 450ms var(--ease); }

  /* One channel is a small CRT screen under curved glass, not a framed card:
     the artwork fills the whole rounded tile, and everything else lies on it.
     Image pieces come from S:\alvidaa\server\make_frame.py; the 9-slices
     (border-image) keep the corners exact at any tile size. Back to front:
     - .ch: the short contact shadow (wii-shadow.png), outside the tile via
       border-image-outset; no box-shadow.
     - .face: the screen, clipped to the corner radius; .art fills it.
     - .face::before: scanlines, scan.png (1 x 4 px) repeated over the art.
     - .gloss: the glass sheen, a broad light diagonal across the top-left.
     - names, pill, tag.
     - .face::after: screen.png, the glass vignette (dark at the edges,
       darkest at the corners and the top) and a 1-2 px light edge, brighter
       on top. Its middle is clear.
     Cost: static images and gradients, painted once; no filters, no blend
     modes, no animation. --pad is the text inset from the tile edge. */
  .ch { --pad: 1.4rem; width: 100%; height: 100%; border-radius: var(--r-ch); background: transparent;
        border-style: solid; border-width: 0; border-color: transparent;
        border-image: url(/icons/wii-shadow.png) 174 / 5.8rem / 1.4rem stretch; }
  .ch.nav::after { border-radius: calc(var(--r-ch) + 0.5rem); }
  .ch:focus { transform: translateY(-0.4rem) scale(1.03); z-index: 2; }
  .ch > .face { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: var(--r-ch); overflow: hidden; background: var(--card-base); }
  .ch > .face::before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none;
                        background: url(/icons/scan.png) 0 0 / 100% 3px repeat; opacity: var(--scan-op); }
  .ch > .face::after { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none;
                       opacity: var(--glass-op);
                       border-style: solid; border-width: 0; border-image: url(/icons/screen.png) 132 / 4.4rem stretch; }
  .face > * { position: absolute; }
  .face > .shade, .face > .gloss, .face > .name, .face > .sigpill, .face > .tag { z-index: 2; }
  .face > .art { left: 0; top: 0; right: 0; bottom: 0; }
  .face > .shade { left: 0; top: 0; right: 0; height: 42%; transition: opacity 300ms linear;
                   background: linear-gradient(180deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.12) 55%, rgba(0, 0, 0, 0)); }
  .face > .gloss { left: 0; top: 0; right: 0; bottom: 0;
                   background: linear-gradient(120deg, rgba(255, 255, 255, 0) 8%, rgba(255, 255, 255, 0.16) 20%,
                               rgba(255, 255, 255, 0.07) 30%, rgba(255, 255, 255, 0) 42%); }
  .face > .name { left: var(--pad); top: 0.9rem; right: var(--pad); font-size: 2.4rem; font-weight: 800; color: #fff;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0.1rem 0.3rem rgba(0, 0, 0, 0.6); }

  /* Artwork: a monogram on the same white plastic first, then the icon
     (cover) once decoded. Without an image the name is dark, with no shade. */
  .art::before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: inherit;
                 background: var(--card); transition: opacity 300ms linear; }
  .art.has-img::before { opacity: 0; }
  .art:not(.has-img) ~ .shade { opacity: 0; }
  .art:not(.has-img) ~ .name { color: var(--card-ink); text-shadow: 0 0.1rem 0 var(--card-ink-shadow); }
  .art:not(.has-img) ~ .sigpill { background: var(--card-pill); color: var(--card-ink); }
  .art:not(.has-img) ~ .sigpill.unknown .dot { border-color: var(--card-pill-dot); }
  .mono { color: var(--fg, #3d6391); color: color-mix(in srgb, var(--fg, #3d6391) var(--mono-mix), #ffffff); transition: opacity 250ms linear; }
  .has-img .mono { opacity: 0; }
  .icon { opacity: 0; transition: opacity 300ms linear; object-fit: cover; }
  .has-img .icon { opacity: 1; }
  .ch .mono { position: absolute; left: 0; right: 0; top: 16%; bottom: 0; display: flex; align-items: center; justify-content: center;
              font-size: 8.4rem; font-weight: 800; letter-spacing: -0.2rem; line-height: 1; opacity: 0.85;
              text-shadow: var(--mono-shadow); }
  .ch .has-img .mono { opacity: 0; }
  .ch .icon { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

  /* Input channels: artwork like the apps, plus a signal pill bottom-left and a tag top-right. */
  .face > .sigpill { left: 1.2rem; bottom: 1.2rem; display: flex; align-items: center; gap: 0.8rem; padding: 0.3rem 1.2rem 0.3rem 0.9rem;
                     border-radius: 99rem; background: rgba(0, 0, 0, 0.38); color: #fff; font-size: 1.7rem; font-weight: 700; }
  .sigpill .dot { width: 1.2rem; height: 1.2rem; border-radius: 50%; background: rgba(255, 255, 255, 0.45); }
  .sigpill.on .dot { background: #5fd38a; }
  .sigpill.unknown .dot { background: none; border: 0.2rem dotted rgba(255, 255, 255, 0.7); }
  .face > .tag { right: 1.2rem; top: 1.1rem; padding: 0.1rem 1.1rem; border-radius: 99rem; font-size: 1.5rem; font-weight: 800;
                 background: var(--tag-bg); color: var(--tag-ink); }
  .face > .tag:empty { display: none; }
  .ch.current .tag { background: var(--blue); color: #fff; }
  .ch.current { border-color: #bfe4fb; }
  .face > .name.withtag { right: 13rem; }

  /* Empty cells: faint embossed placeholders with a soft screen outline. */
  .ph { position: relative; border-radius: var(--r-ch);
        background: var(--ph-bg); box-shadow: var(--ph-shadow); }
  .ph::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8rem; height: 5rem; margin: -2.5rem 0 0 -4rem;
               border-radius: 0.9rem; border: 0.25rem solid var(--ph-mark);
               box-shadow: inset 0 0.12rem 0 rgba(70, 80, 95, 0.07), 0 -0.12rem 0 rgba(70, 80, 95, 0.07); }

  /* Page arrows at the sides, for the pointer (the arrows keys page too). */
  .arrow { position: absolute; top: 37.1rem;   /* centred on the window: 3.4rem + 75.4rem / 2 - 4rem */ width: 6rem; height: 8rem; display: flex; align-items: center; justify-content: center;
           color: var(--blue); transition: opacity 200ms linear, transform 200ms var(--ease); }
  .arrow svg { width: 4.4rem; height: 6.4rem; display: block; }
  .arrow:hover { transform: scale(1.1); }
  .arrow[disabled] { opacity: 0; pointer-events: none; }
  #pgPrev { left: calc(50% - 2 * var(--ch-w) - 1.5 * var(--gap) - 8.6rem); }
  #pgNext { right: calc(50% - 2 * var(--ch-w) - 1.5 * var(--gap) - 8.6rem); }

  /* ================================================================== */
  /* Bottom bar: metallic strip under a curved line                      */
  /* ================================================================== */
  /* The bar itself is transparent: the SVG draws the metal below the curved
     line (its shadow, the cyan line, the highlight at the bottom); above
     the line the silver page shows through, holding the clock. */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 22rem; }
  .bar .wave { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .orb { position: absolute; bottom: 3.2rem; width: 12rem; height: 12rem; border-radius: 50%;
         display: flex; align-items: center; justify-content: center; color: var(--orb-ink);
         background: var(--orb-bg);
         border: 0.35rem solid #5fc0ec;
         box-shadow: var(--orb-socket); }
  .orb::before { border-radius: 50%; }
  .orb::after { border-radius: 50%; }
  .orb:focus { transform: translateY(-0.3rem) scale(1.03); }
  .orb svg { width: 5.6rem; height: 5.6rem; display: block; }
  #orbHome { left: 5vw; }
  #orbSettings { right: 5vw; }

  /* Clock above the line (on the silver), date below it (on the metal). */
  .clockbox { position: absolute; left: 50%; top: 1.4rem; width: 60rem; margin-left: -30rem; text-align: center; }
  #clock { font-size: 8.6rem; line-height: 1; font-weight: 200; letter-spacing: 0.5rem; color: var(--clock); font-variant-numeric: tabular-nums;
           text-shadow: 0 0.15rem 0 var(--clock-shadow); }
  #clock .sep { position: relative; top: -0.4rem; }
  #clock small { font-size: 2.4rem; font-weight: 700; letter-spacing: 0.1rem; margin-left: 0.8rem; }
  #date { margin-top: 3rem; font-size: 3rem; font-weight: 700; color: var(--date); text-shadow: 0 0.1rem 0 var(--date-shadow); }

  /* The small chrome beside the orbs starts clear of them: orb at 5vw,
     12rem wide, its socket ring 1.25rem around it, then a 2.4rem gap. */
  .bar { --beside-orb: calc(5vw + 12rem + 1.25rem + 2.4rem); }
  .cluster { position: absolute; top: 12.6rem; display: flex; flex-direction: column; gap: 0.8rem; font-size: 2rem; color: var(--chrome); }
  .cluster.l { left: var(--beside-orb); align-items: flex-start; }
  .cluster.r { right: var(--beside-orb); align-items: flex-end; text-align: right; }
  .cluster b { color: var(--ink); }
  .status { display: inline-flex; align-items: center; gap: 1rem; padding: 0.6rem 1.8rem 0.6rem 1.4rem; border-radius: 99rem;
            background: var(--pill-bg); font-size: 2rem; font-weight: 800; color: var(--ink-soft); }
  .status .dot { width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--ok); }
  .status.connecting .dot { background: var(--warn); animation: breathe 1.6s ease-in-out infinite; }
  .status.offline { background: var(--pill-off-bg); color: var(--pill-off-ink); }
  .status.offline .dot { background: var(--warn); }
  @keyframes breathe { 50% { opacity: 0.3; } }
  .pageinfo { display: flex; align-items: center; gap: 1.2rem; }
  .pageinfo.single { visibility: hidden; }
  .dots { display: flex; gap: 0.8rem; }
  .dots i { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--dots); }
  .dots i.on { background: var(--blue); }

  #toast { position: fixed; left: 50%; bottom: 22rem; z-index: 40; max-width: 120rem; padding: 1.5rem 3.2rem; border-radius: 99rem;
           background: var(--toast-bg); color: var(--toast-ink); font-size: 2.4rem; font-weight: 700; box-shadow: 0 0.4rem 1rem rgba(30, 40, 60, 0.3);
           opacity: 0; transform: translate(-50%, 1.2rem); pointer-events: none;
           transition: opacity 180ms linear, transform 240ms var(--ease); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: #a8402c; }

  /* ================================================================== */
  /* Settings: a full page sliding in from the right, in the console's   */
  /* system-settings style: category tiles on the left, a large panel of */
  /* rows on the right, Retour / OK in a metallic bar at the bottom.     */
  /* ================================================================== */
  /* TV safe area: overscan can hide up to ~5 % of each side, so nothing that
     matters sits closer to the edge than that. In vw / vh, not rem, so it
     holds at any aspect ratio. --sx: the side margin (wider screens centre a
     172.8rem column). Vertical budget at 16:9 (rem): 5.4 safe + 8.4 title
     + 1.8 + 71.4 body + 0.6 + 20.4 bar = 108; six rows fit with ~1rem spare. */
  #settings { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 20;
              --safe-x: 5vw; --safe-y: 5vh;
              --sx: max(var(--safe-x), calc((100vw - 172.8rem) / 2));
              display: flex; flex-direction: column; background-color: var(--bg); background-image: var(--silver);
              visibility: hidden; transform: translateX(100%); transition: transform 380ms var(--ease), visibility 0s linear 380ms; }
  .open #settings { visibility: visible; transform: translateX(0); transition: transform 380ms var(--ease), visibility 0s; }

  /* Focus inside settings: soft blue fill (::before) and a white ring with
     a thin blue line (::after). No lift shadow. */
  #settings .nav::before { background: var(--sel-fill); box-shadow: none; }
  #settings .nav::after { left: -0.6rem; top: -0.6rem; right: -0.6rem; bottom: -0.6rem;
                          border: 0.6rem solid #fff; box-shadow: 0 0 0 0.25rem var(--blue); }

  /* Title plate */
  .shead { flex: none; display: flex; align-items: center; gap: 2rem; height: 8.4rem; margin: var(--safe-y) var(--sx) 0; padding: 0 2.4rem 0 4rem;
           border-radius: 4.8rem; background: var(--plate); border: 0.3rem solid var(--plate-edge);
           box-shadow: 0 0.2rem 0.6rem rgba(40, 60, 90, 0.14); }
  .shead h1 { font-size: 4.4rem; font-weight: 800; line-height: 1.1; }
  .shead .crumb { font-size: 3.2rem; font-weight: 700; color: var(--ink-soft); }
  .shead .crumb::before { content: "›"; margin-right: 1.6rem; color: var(--blue); }

  .sbody { flex: 1; min-height: 0; display: flex; gap: 3.2rem; margin: 1.8rem var(--sx) 0; }

  /* Left column: four category tiles, a round pictogram and a label. */
  .cats { width: 44rem; flex: none; display: flex; flex-direction: column; gap: 2rem; }
  .cat { flex: 1; max-height: 17rem; min-height: 0; display: flex; align-items: center; gap: 2.4rem; padding: 0 2.4rem;
         border-radius: 3.2rem; border: 0.3rem solid var(--cat-edge);
         background: var(--cat-bg); box-shadow: 0 0.25rem 0.5rem rgba(40, 60, 90, 0.16); }
  #settings .cat::after { border-radius: 3.8rem; }
  .cat:focus { transform: scale(1.02); z-index: 2; }
  .cat .pic { width: 10rem; height: 10rem; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
              color: var(--pic-ink); border: 0.3rem solid var(--pic-edge); background: var(--pic-bg); }
  .cat .pic svg { width: 5.6rem; height: 5.6rem; display: block; }
  .cat .cl { display: flex; flex-direction: column; min-width: 0; }
  .cat .cl b { font-size: 3.2rem; font-weight: 800; line-height: 1.15; }
  .cat .cl small { font-size: 2rem; font-weight: 700; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat.sel { border-color: var(--cat-sel-edge); background: var(--cat-sel-bg); }
  .cat.sel .pic { color: #fff; border-color: #fff; background: radial-gradient(circle at 50% 30%, #8fd2f7 0%, #2c9be0 75%); }
  .cat.warn .cl small { color: var(--warn-ink); }

  /* Right panel: a thick rounded white surface. */
  .spanel { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 2rem 3.2rem 2.4rem; border-radius: 4rem;
            background: var(--panel-bg); border: 0.4rem solid var(--panel-edge); box-shadow: 0 0.3rem 0.8rem rgba(40, 60, 90, 0.14); }
  .phead { flex: none; display: flex; align-items: center; gap: 1.6rem; height: 6.4rem; margin-bottom: 1.2rem; padding: 0 0.8rem; }
  .phead h2 { font-size: 3.6rem; font-weight: 800; line-height: 1.1; }
  .badge { padding: 0.3rem 1.6rem; border-radius: 99rem; background: var(--badge-bg); color: var(--badge-ink); font-size: 2.2rem; font-weight: 800; }
  .chip { padding: 0.4rem 1.8rem; border-radius: 99rem; background: var(--chip-bg); border: 0.2rem solid var(--chip-edge); font-size: 2.4rem; font-weight: 800;
          color: var(--ink); font-variant-numeric: tabular-nums; }
  .badge:empty, .chip:empty { display: none; }
  .parrows { display: flex; gap: 1rem; }
  .parrows.single { visibility: hidden; }
  .parrow { width: 6rem; height: 6rem; display: flex; align-items: center; justify-content: center; color: var(--blue);
            transition: opacity 200ms linear, transform 200ms var(--ease); }
  .parrow svg { width: 4.4rem; height: 3.4rem; display: block; }
  .parrow:hover { transform: scale(1.12); }
  .parrow[disabled] { opacity: 0.25; pointer-events: none; }

  /* Rows: a pool of at most PAGE_ROWS buttons, refilled per page. */
  .srows { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1.2rem; padding: 1.2rem; margin: -1.2rem; overflow: hidden; }
  .srow { flex: none; width: 100%; height: 8.8rem; display: flex; align-items: center; gap: 2rem; padding: 0 2.6rem 0 3rem;
          border-radius: 2.6rem; border: 0.25rem solid var(--row-edge); background: var(--row-bg); }
  #settings .srow::after { border-radius: 3.2rem; }
  .srow:focus { z-index: 2; }
  .srow .label { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .srow .t { font-size: 3rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow small { font-size: 2rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow small:empty { display: none; }
  .srow .val { flex: none; font-size: 3rem; font-weight: 800; color: var(--ink-soft); white-space: nowrap; text-align: right; }
  .srow.on .val { color: var(--on-ink); }
  .srow.warn .val { color: var(--warn-ink); }
  .srow.armed .val { color: var(--armed-ink); }
  .srow.dim .t, .srow.dim .ico { opacity: 0.5; }
  .srow.info { height: 7.2rem; border-color: transparent; background: rgba(44, 155, 224, 0.07); cursor: default; }
  .srow.info .t { font-size: 2.6rem; color: var(--ink-soft); }
  .srow .ico { display: none; position: relative; width: 8.4rem; height: 6.3rem; flex: none; border-radius: 1rem; overflow: hidden; border: 0.2rem solid var(--ico-edge); }
  .srow.hasico .ico { display: block; }
  .ico > .art { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .ico .mono { position: relative; font-size: 2.6rem; font-weight: 800; }
  .ico .icon { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .srow .more { display: none; width: 2rem; height: 2rem; margin: 0 0.6rem 0 -0.4rem; flex: none;
                border-top: 0.5rem solid var(--blue); border-right: 0.5rem solid var(--blue); transform: rotate(45deg); }
  .srow.hasmore .more { display: block; }
  .sempty { padding: 4rem 2rem; text-align: center; font-size: 2.8rem; font-weight: 700; color: var(--ink-soft); }

  .sw { display: none; position: relative; width: 8.8rem; height: 4.8rem; flex: none; border-radius: 2.4rem; background: var(--sw-track); }
  .srow.hasw .sw { display: block; }
  .sw::before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 2.4rem; background: var(--blue); opacity: 0; transition: opacity 200ms linear; }
  .sw::after { content: ""; position: absolute; left: 0.4rem; top: 0.4rem; width: 4rem; height: 4rem; border-radius: 50%; background: #fff;
               box-shadow: 0 0.1rem 0.3rem rgba(0, 0, 0, 0.25); transition: transform 230ms var(--ease); }
  .on .sw::before { opacity: 1; }
  .on .sw::after { transform: translateX(4rem); }
  .snap .sw::before, .snap .sw::after { transition: none; }

  /* Bottom bar: Retour on the left, a big round OK on the right. */
  /* The bar is seated like the console's: the metal stops 2rem above the
     screen edge (silver shows under it), and the buttons sit inside it.
     - .wave (fixed 8rem, never stretched with the screen height): the cyan
       line at 1.2rem on the sides, dipping to 5.6rem over the hint, and the
       top of the metal.
     - ::before: the rest of the metal, from 8rem down to 2rem above the
       bottom, darker at its foot, with a light lip and a soft shadow;
       ::after: the lighter silver strip under it.
     - Buttons are placed from the bar's top, so their clearance to the line
       is fixed: the focus ring reaches 0.85rem beyond a button (0.6rem white
       + 0.25rem blue), times the focus zoom. OK (9rem, zoom 1.05): ring top
       at 7.9 - 5.62 = 2.28rem, 0.93rem under the line's stroke (1.35rem),
       more than one ring width. Retour (zoom 1.03): ring top at 2.49rem.
     - Height = 12.4rem (line + buttons) + --safe-y + 0.6rem of metal under
       the buttons (5 % of the height even when OK zooms on focus) + 2rem of
       silver: 20.4rem at 16:9, more on taller screens.
     - Sides: buttons at --sx + 1.2rem, so even their ring stays inside the
       5 % safe area. */
  .sbar { flex: none; position: relative; height: calc(15rem + var(--safe-y)); margin-top: 0.6rem; }
  .sbar .wave { position: absolute; left: 0; top: 0; width: 100%; height: 8rem; display: block; }
  .sbar::before { content: ""; position: absolute; left: 0; right: 0; top: 8rem; bottom: 2rem;
                  background: var(--smetal-body);
                  box-shadow: inset 0 -0.2rem 0 var(--smetal-lip), 0 0.3rem 0.45rem -0.1rem rgba(40, 55, 75, 0.28); }
  /* The silver margin under the bar: lighter than the metal, so the bar
     reads as seated above the screen edge. */
  .sbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2rem;
                 background: var(--smetal-foot); }
  .sback { position: absolute; left: calc(var(--sx) + 1.2rem); top: 3.5rem; height: 8.8rem; padding: 0 4.4rem 0 3rem; display: flex; align-items: center; gap: 1.4rem;
           border-radius: 99rem; border: 0.4rem solid var(--btn-edge); color: var(--btn-ink); font-size: 3.4rem; font-weight: 800;
           background: var(--btn-bg); box-shadow: 0 0.2rem 0.4rem rgba(40, 60, 90, 0.25); }
  .sback svg { width: 4.4rem; height: 4.4rem; display: block; }
  .sok { position: absolute; right: calc(var(--sx) + 1.2rem); top: 3.4rem; width: 9rem; height: 9rem; border-radius: 50%;
         display: flex; align-items: center; justify-content: center; text-align: center; color: var(--btn-ink); font-size: 4.2rem; font-weight: 800;
         border: 0.4rem solid var(--btn-edge); background: var(--btn-round);
         box-shadow: 0 0.2rem 0.4rem rgba(40, 60, 90, 0.25); }
  #settings .sback::before, #settings .sback::after { border-radius: 99rem; }
  #settings .sok::before, #settings .sok::after { border-radius: 50%; }
  .sback:focus { transform: scale(1.03); }
  .sok:focus { transform: scale(1.05); }
  .sbar .hint { position: absolute; left: 50%; top: 6.5rem; transform: translateX(-50%); white-space: nowrap;
                font-size: 2.2rem; font-weight: 700; color: var(--ink-soft); }
  .sbar .hint b { color: var(--ink); }

  /* The version label belongs to the home screen; it would sit on Retour. */
  .open #ver { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {
    .status.connecting .dot { animation: none; }
    *, *::before, *::after { transition-duration: 1ms !important; transition-delay: 0s !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div id="ver" style="position:fixed;left:calc(5vw + 15.65rem + 0.6rem);bottom:10.4rem;z-index:99;font:700 1.6rem/1 var(--font);color:var(--ver);pointer-events:none">launcher v24</div>

<!-- ============================== Home ============================== -->
<main id="home">
  <div class="window" id="appWindow"><div class="grid" id="grid"></div></div>

  <button class="arrow" id="pgPrev" data-act="page-prev" aria-label="Page précédente">
    <svg viewBox="0 0 44 64" aria-hidden="true"><path d="M38 6 L8 32 L38 58 Z" fill="currentColor" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
  </button>
  <button class="arrow" id="pgNext" data-act="page-next" aria-label="Page suivante">
    <svg viewBox="0 0 44 64" aria-hidden="true"><path d="M6 6 L36 32 L6 58 Z" fill="currentColor" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
  </button>

  <div class="bar" id="bar">
    <!-- Metallic strip; its top edge dips between the two round buttons. -->
    <svg class="wave" viewBox="0 0 1920 220" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--metal-1)"/><stop offset="0.55" style="stop-color:var(--metal-2)"/>
          <stop offset="0.93" style="stop-color:var(--metal-3)"/><stop offset="1" style="stop-color:var(--metal-4)"/>
        </linearGradient>
        <path id="wl" d="M0 22 L290 22 C470 22 450 116 650 116 L1270 116 C1470 116 1450 22 1630 22 L1920 22"/>
      </defs>
      <!-- Metal below the line; the line dips in the middle around the clock. -->
      <path d="M0 22 L290 22 C470 22 450 116 650 116 L1270 116 C1470 116 1450 22 1630 22 L1920 22 L1920 220 L0 220 Z" fill="url(#metal)"/>
      <!-- Inset shadow under the line: fine strokes shifted downwards, each
           covering 2 px more, so the shade fades smoothly over 24 px. -->
      <g fill="none" style="stroke:var(--metal-shade);stroke-opacity:var(--metal-shade-op)">
        <use href="#wl" transform="translate(0 1)" stroke-width="2"/><use href="#wl" transform="translate(0 2)" stroke-width="4"/>
        <use href="#wl" transform="translate(0 3)" stroke-width="6"/><use href="#wl" transform="translate(0 4.5)" stroke-width="9"/>
        <use href="#wl" transform="translate(0 6)" stroke-width="12"/><use href="#wl" transform="translate(0 8)" stroke-width="16"/>
        <use href="#wl" transform="translate(0 10)" stroke-width="20"/><use href="#wl" transform="translate(0 12)" stroke-width="24"/>
      </g>
      <!-- Highlight along the bottom edge. -->
      <rect x="0" y="214" width="1920" height="6" fill="#ffffff" style="fill-opacity:var(--metal-hi1)"/>
      <rect x="0" y="217.5" width="1920" height="2.5" fill="#ffffff" style="fill-opacity:var(--metal-hi2)"/>
      <!-- White lip above, then the cyan line. -->
      <use href="#wl" transform="translate(0 -2.5)" fill="none" stroke="#ffffff" stroke-width="2.5" style="stroke-opacity:var(--metal-lip)"/>
      <use href="#wl" fill="none" stroke-width="3.2" style="stroke:var(--cyan)"/>
    </svg>

    <button class="nav orb" id="orbHome" data-nav data-key="orb-home" data-act="home" aria-label="Accueil">
      <!-- Launcher mark: a screen with a play triangle. -->
      <svg viewBox="0 0 56 56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
        <rect x="6" y="10" width="44" height="30" rx="7"/><path d="M24 19 L34 25 L24 31 Z" fill="currentColor"/><path d="M20 47 H36"/>
      </svg>
    </button>

    <div class="cluster l">
      <div class="status connecting" id="status"><span class="dot"></span><span class="st">connexion…</span></div>
      <div class="pageinfo" id="pageinfo"><span class="dots" id="dots"></span><span id="pageText"></span></div>
    </div>

    <div class="clockbox"><div id="clock">--</div><div id="date">&nbsp;</div></div>

    <div class="cluster r">
      <span id="lastLabel"></span>
      <span id="appNote"></span>
    </div>

    <button class="nav orb" id="orbSettings" data-nav data-key="orb-settings" data-act="open" aria-label="Réglages">
      <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
        <circle cx="24" cy="24" r="6.5"/><circle cx="24" cy="24" r="14"/>
        <path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/>
      </svg>
    </button>
  </div>
</main>

<!-- ============================ Settings ============================ -->
<section id="settings" aria-label="Réglages">
  <header class="shead">
    <h1>Réglages</h1><span class="crumb" id="setCrumb">Affichage</span>
    <span class="spacer"></span>
    <div class="status connecting" id="status2"><span class="dot"></span><span class="st">connexion…</span></div>
  </header>

  <div class="sbody">
    <nav class="cats" aria-label="Catégories">
      <button class="nav cat sel" data-nav data-key="cat:display" data-act="cat-enter" data-id="display">
        <span class="pic"><svg viewBox="0 0 56 56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">
          <rect x="6" y="9" width="44" height="30" rx="6"/><path d="M20 47 H36 M28 39 V47"/><path d="M17 31 L25 22 L31 27 L39 18"/>
        </svg></span>
        <span class="cl"><b>Affichage</b><small id="catNote-display"></small></span>

      <button class="nav cat" data-nav data-key="cat:sources" data-act="cat-enter" data-id="sources">
        <span class="pic"><svg viewBox="0 0 56 56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">
          <path d="M6 28 H32"/><path d="M23 19 L32 28 L23 37"/><path d="M28 9 H44 A6 6 0 0 1 50 15 V41 A6 6 0 0 1 44 47 H28"/>
        </svg></span>
        <span class="cl"><b>Sources</b><small id="catNote-sources"></small></span>
      </button>
      <button class="nav cat" data-nav data-key="cat:apps" data-act="cat-enter" data-id="apps">
        <span class="pic"><svg viewBox="0 0 56 56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linejoin="round">
          <rect x="8" y="8" width="16" height="16" rx="4"/><rect x="32" y="8" width="16" height="16" rx="4"/>
          <rect x="8" y="32" width="16" height="16" rx="4"/><rect x="32" y="32" width="16" height="16" rx="4"/>
        </svg></span>
        <span class="cl"><b>Applications</b><small id="catNote-apps"></small></span>

          <circle cx="24" cy="24" r="6.5"/><circle cx="24" cy="24" r="14"/>
          <path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/>
        </svg></span>

    <div class="spanel" id="setPanel">
      <div class="phead">
        <h2 id="setTitle">Affichage</h2><span class="badge" id="setNote"></span>
        <span class="spacer"></span>
        <span class="chip" id="setPos"></span><span class="chip" id="setPage"></span>
        <span class="parrows" id="setArrows">
          <button class="parrow" id="setPrev" data-act="set-prev" tabindex="-1" aria-label="Page précédente">
            <svg viewBox="0 0 44 34" aria-hidden="true"><path d="M5 29 L22 5 L39 29 Z" fill="currentColor" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/></svg>
          </button>
          <button class="parrow" id="setNext" data-act="set-next" tabindex="-1" aria-label="Page suivante">
            <svg viewBox="0 0 44 34" aria-hidden="true"><path d="M5 5 L22 29 L39 5 Z" fill="currentColor" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/></svg>
          </button>
        </span>
      </div>
      <div class="srows" id="setRows"></div>
    </div>
  </div>

  <footer class="sbar" id="setBar">
    <!-- Top 8rem of the bar (80 units = 8rem tall; only the width stretches):
         the line is flat at 1.2rem over Retour and OK and dips to 5.6rem
         across the middle, above the hint. The metal continues in CSS. -->
    <svg class="wave" viewBox="0 0 1920 80" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--smetal-1)"/><stop offset="1" style="stop-color:var(--smetal-2)"/>
        </linearGradient>
      </defs>
      <path d="M0 12 L440 12 C580 12 600 56 740 56 L1180 56 C1320 56 1340 12 1480 12 L1920 12 L1920 80 L0 80 Z" fill="url(#metal2)"/>
      <path d="M0 12 L440 12 C580 12 600 56 740 56 L1180 56 C1320 56 1340 12 1480 12 L1920 12" fill="none" stroke-width="3" vector-effect="non-scaling-stroke" style="stroke:var(--scyan)"/>
    </svg>
    <button class="nav sback" id="setBack" data-nav data-key="bar:back" data-act="close">
      <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M15 8 L6 17 L15 26"/><path d="M6 17 H30 A11 11 0 0 1 30 39 H18"/>
      </svg>
      <span>Retour</span>
    </button>
    <div class="hint"><b>▲ ▼</b> choisir · <b>OK</b> modifier · <b>◀</b> catégories · <b>Retour</b> accueil</div>
    <button class="nav sok" id="setOk" data-nav data-key="bar:ok" data-act="done"><span>OK</span></button>
  </footer>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ================================================================== */
  /* Constants                                                           */
  /* ================================================================== */
  var WS_URL = 'ws://' + (location.host || '127.0.0.1:8766') + '/ws';
  var RETRY_MS = 3000;            // reconnect delay
  var CONNECT_TIMEOUT_MS = 6000;  // drop a socket stuck in CONNECTING
  var CACHE_KEY = 'tvlauncher.v1.snapshot';      // same keys as v1: the cache carries over
  var LAST_KEY = 'tvlauncher.v1.lastSource';
  var PENDING_KEY = 'tvlauncher.v1.pendingSettings';
  var THEME_KEY = 'tvlauncher.v1.theme';            // 'auto' | 'light' | 'dark' (read before first paint too)
  var NIGHT_FROM = 20, NIGHT_TO = 8;                // auto: dark from 20:00 to 08:00
  var SOURCE_IDS = ['tv', 'hdmi1', 'hdmi2', 'hdmi3', 'hdmi4'];
  /* The owner's kinds come first; any other kind is a TV app. */
  var KINDS = { app: 'Application', game: 'Jeu', lab: 'Labo', settings: 'Réglages', tv: 'Appli du téléviseur' };
  var CUSTOM_KINDS = ['app', 'game', 'lab', 'settings'];
  /* Grid geometry, in rem: must match --ch-w / --gap in the CSS. Pages are
     side by side; a page is 4 columns wide. */
  var COLS = 4, ROWS = 3, PER_PAGE = COLS * ROWS, CH_W = 40, GAP = 2.2, PAGE_W = COLS * (CH_W + GAP);
  var CLOCK_12H = false;          // true: "9:47 PM"; false (French default): "21:47"
  var ICON_PARALLEL = 4, ICON_TIMEOUT_MS = 8000;
  var DAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
                'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  /* Monogram tints: [gradient top, gradient bottom, letter colour]. */
  var TINTS = [
    ['#e9f2fb', '#cadcf1', '#3a5f8c'], ['#e8f5ec', '#c6e3cf', '#356f4c'], ['#fcf0e6', '#f0d5c0', '#8d5934'],
    ['#f1ecf9', '#d8ccee', '#634f93'], ['#e5f4f4', '#c2e0e0', '#2f6c6c'], ['#faf3e0', '#ebdab0', '#7d6224'],

      { id: 'photos', name: 'Photos', kind: 'app', sub: 'Albums de famille', icon: '' },

    });
    return out;
  }
  function cleanSources(list) {
    if (!Array.isArray(list)) return null;

    list.forEach(function (s) {

  /* ================================================================== */

  /* What is displayed: the override tile list merged with live signals. */

  /* ================================================================== */

  /* Fill an .art element: tint + monogram now, the icon when available.

    if (c === 'display') {

        { key: 'set:auto', act: 'toggle-auto', label: 'Démarrer sur la dernière entrée',

                            : 'À l’allumage, ce lanceur s’affiche.',

        { key: 'set:theme', act: 'cycle-theme', label: 'Thème',

          value: themeLabel() },

                      : online ? '' : 'Nouvel essai toutes les 3 s' },
      { label: 'Entrée en cours', value: online ? (model.current ? nameOf(model.current) : 'Ce lanceur') : 'Inconnue' },
      { label: 'Dernière entrée', value: lastSource ? nameOf(lastSource) : 'Aucune pour l’instant' },
      { label: 'Données', value: cap(dataAge()) },
      { key: 'show-all', act: 'show-all', label: 'Tout réafficher', sub: 'Remet chaque entrée et application sur l’accueil.',
        value: hiddenCount ? plural(hiddenCount, 'masquée', 'masquées') : 'Rien de masqué' },
      { key: 'reset', act: 'reset', label: 'Réinitialiser', armed: resetArmed, value: resetArmed ? 'Confirmer ?' : '',
        sub: resetArmed ? 'Appuyez encore sur OK pour tout remettre par défaut.' : 'Démarrage, éléments masqués et dernière entrée.' }
    ];
  }

  function makeSlot() {
    var el = h('button', { className: 'srow', type: 'button' }, [
      h('span', { className: 'ico' }), h('span', { className: 'label' }, [h('span', { className: 't' }), h('small')]),
      h('span', { className: 'val' }), h('span', { className: 'sw' }), h('span', { className: 'more' })
    ]);
    el._ico = el.children[0];
    el._t = el.children[1].firstChild;
    el._small = el.children[1].lastChild;
    el._val = el.children[2];
    el._art = h('span', { className: 'art' });
    return el;
  }

  /* Fill one pooled slot. Returns true when it now shows another item (its
     switch then jumps instead of sliding). */
  function fillSlot(el, r) {
    var ident = r.key || 'info:' + r.label, snap = el._ident !== ident;
    el._ident = ident;
    var cls = (r.key ? 'nav srow' : 'srow info') + (r.sw ? ' hasw' : '') + (r.on ? ' on' : '') + (r.dim ? ' dim' : '') +
              (r.more ? ' hasmore' : '') + (r.armed ? ' armed' : '') + (r.warn ? ' warn' : '') + (r.art ? ' hasico' : '') + (snap ? ' snap' : '');
    if (el.className !== cls) el.className = cls;
    if (r.key) {
      el.setAttribute('data-nav', '');
      el.setAttribute('data-key', r.key);
      el.setAttribute('data-act', r.act);
      el.disabled = false;
    } else {
      el.removeAttribute('data-nav');
      el.removeAttribute('data-key');
      el.removeAttribute('data-act');
      el.disabled = true;
    }
    if (r.id) el.setAttribute('data-id', r.id); else el.removeAttribute('data-id');
    el._icoOn = !!r.art;
    if (r.art) {
      if (el._art.parentNode !== el._ico) el._ico.appendChild(el._art);
      paintArt(el._art, r.art);
    }
    setText(el._t, r.label);
    setText(el._small, r.sub || '');
    setText(el._val, r.value || '');
    return snap;
  }

  /* Draw the current category. paging=false (data changed): the focused
     item keeps the focus, on whatever page it now is. paging=true: the
     caller chose the page and moves the focus itself. */
  function renderSettings(paging) {
    if (!panelOpen) return;
    var rows = curRows = rowsFor(cat), pages = pagesOf(rows);
    var act = document.activeElement, inRows = rowsBox.contains(act);
    var key = inRows ? act.getAttribute('data-key') : null, slotIndex = inRows ? visibleSlots().indexOf(act) : -1;
    if (key && !paging) {
      var at = keyIndex(rows, key);
      if (at >= 0) catPage[cat] = Math.floor(at / PAGE_ROWS);
    }
    var p = catPage[cat] = Math.max(0, Math.min(catPage[cat], pages - 1));
    var slice = rows.slice(p * PAGE_ROWS, (p + 1) * PAGE_ROWS), snapped = [];
    while (slots.length < slice.length) slots.push(makeSlot());
    slots.forEach(function (el, i) {
      if (i < slice.length) {
        if (fillSlot(el, slice[i])) snapped.push(el);
        if (el.parentNode !== rowsBox) rowsBox.appendChild(el);   // slots stay in order: only the tail is ever detached
      } else if (el.parentNode) {
        el.parentNode.removeChild(el);
      }
    });
    if (snapped.length) {
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () { snapped.forEach(function (el) { el.classList.remove('snap'); }); });
      });
    }
    if (rows.length) { if (emptyEl.parentNode) rowsBox.removeChild(emptyEl); }
    else {
      setText(emptyEl, cat === 'apps' ? 'Aucune application pour l’instant.' : 'Aucune entrée.');
      if (!emptyEl.parentNode) rowsBox.appendChild(emptyEl);
    }

    // The focused row was replaced: find its item again, else the nearest row, else the category.
    if (inRows && !paging && (!rowsBox.contains(act) || act.getAttribute('data-key') !== key)) {
      var vis = visibleSlots(), t = null;
      for (var i = 0; i < vis.length; i++) if (vis[i].getAttribute('data-key') === key) t = vis[i];
      if (!t && vis.length) t = vis[Math.min(Math.max(slotIndex, 0), vis.length - 1)];
      focusEl(t || catEl(cat), false);
    }
    updateSettingsChrome(p, pages);
    if (cat === 'apps' || cat === 'sources') requestIcons();
  }

  function updateSettingsChrome(p, pages) {
    var v = view(), s = model.settings;
    CATS.forEach(function (c) { setClass(catEl(c), 'sel', c === cat); });
    setText($('setCrumb'), CAT_NAMES[cat]);
    setText($('setTitle'), CAT_NAMES[cat]);
    setText($('catNote-display'), 'Reprise auto : ' + (s.autoSwitch ? 'OUI' : 'NON'));
    setText($('catNote-sources'), countShown(v.sources) + ' / ' + v.sources.length + ' affichées');
    setText($('catNote-apps'), countShown(v.apps) + ' / ' + v.apps.length + ' affichées');
    setText($('catNote-system'), connLabel());
    setClass(catEl('system'), 'warn', conn.state !== 'online');
    var list = cat === 'sources' ? v.sources : cat === 'apps' ? v.apps : null;
    setText($('setNote'), list ? countShown(list) + ' sur ' + list.length + ' affichées' : '');
    setText($('setPage'), pages > 1 ? 'page ' + (p + 1) + ' / ' + pages : '');
    $('setPrev').disabled = p === 0;
    $('setNext').disabled = p >= pages - 1;
    setClass($('setArrows'), 'single', pages < 2);
    updatePos();
  }

  /* "13 / 62" while an input or application row has the focus. */
  function updatePos() {
    var a = document.activeElement, k = rowsBox.contains(a) ? a.getAttribute('data-key') : null;
    var i = k && (cat === 'sources' || cat === 'apps') ? keyIndex(curRows, k) : -1;
    setText($('setPos'), i >= 0 ? (i + 1) + ' / ' + curRows.length : '');
  }

  /* Focusing a category shows it (remote and pointer alike). */
  function selectCat(c) {
    if (c === cat || CATS.indexOf(c) < 0) return;
    disarmReset();
    cat = c;
    renderSettings(false);
  }

  /* Show page p of the current category; pick: 'first', 'last', a slot
     index, or null (focus stays where it is). */
  function showPage(p, pick) {
    catPage[cat] = p;
    renderSettings(true);
    var vis = visibleSlots();
    if (pick == null || !vis.length) return;
    focusEl(pick === 'last' ? vis[vis.length - 1] : vis[Math.min(pick === 'first' ? 0 : pick, vis.length - 1)], true);
  }

  function settingsPage(delta) {
    var pages = pagesOf(curRows), p = Math.max(0, Math.min(pages - 1, catPage[cat] + delta));
    if (p === catPage[cat]) return;
    var a = document.activeElement;
    showPage(p, rowsBox.contains(a) ? Math.max(0, visibleSlots().indexOf(a)) : null);
  }

  /* Into the rows: 'first', 'last' (of this page), or the last row used. */
  function enterRows(mode) {
    var k = lastRowKey[cat], at = mode ? -1 : (k ? keyIndex(curRows, k) : -1);
    if (at >= 0) { showPage(Math.floor(at / PAGE_ROWS), at % PAGE_ROWS); return; }
    var vis = visibleSlots();
    if (vis.length) focusEl(mode === 'last' ? vis[vis.length - 1] : vis[0], true);
  }

  /* Arrow keys in settings: categories (up/down), rows (up/down, crossing
     pages at the edges; left back to the category), bottom bar. */
  function moveSettings(dir) {
    var a = document.activeElement;
    if (!$('settings').contains(a) || !a.hasAttribute('data-nav')) { restoreFocus(); return; }
    if (a.classList.contains('cat')) {
      var i = CATS.indexOf(a.getAttribute('data-id'));
      if (dir === 'up' && i > 0) focusEl(catEl(CATS[i - 1]), true);
      else if (dir === 'down') focusEl(i < CATS.length - 1 ? catEl(CATS[i + 1]) : $('setBack'), true);
      else if (dir === 'right') enterRows(null);
      return;
    }
    if (rowsBox.contains(a)) {
      var vis = visibleSlots(), j = vis.indexOf(a), p = catPage[cat], pages = pagesOf(curRows);
      if (dir === 'up') { if (j > 0) focusEl(vis[j - 1], true); else if (p > 0) showPage(p - 1, 'last'); }
      else if (dir === 'down') {
        if (j < vis.length - 1) focusEl(vis[j + 1], true);
        else if (p < pages - 1) showPage(p + 1, 'first');
        else focusEl($('setOk'), true);
      }
      else if (dir === 'left') focusEl(catEl(cat), true);
      return;
    }
    var ok = a === $('setOk');
    if (dir === 'left' && ok) focusEl($('setBack'), true);
    else if (dir === 'right' && !ok) focusEl($('setOk'), true);
    else if (dir === 'up') {
      if (ok && visibleSlots().length) enterRows('last');
      else focusEl(catEl(cat), true);
    }
  }

  function restoreSettingsFocus() {
    var key = lastFocusKey.panel;
    if (key === 'bar:back' || key === 'bar:ok') { focusEl($(key === 'bar:ok' ? 'setOk' : 'setBack'), true); return; }
    var at = key ? keyIndex(curRows, key) : -1;
    if (at >= 0) { showPage(Math.floor(at / PAGE_ROWS), at % PAGE_ROWS); return; }
    focusEl(catEl(cat), true);
  }

  function dataAge() {
    if (!model.updatedAt) return 'liste par défaut';
    var d = new Date(model.updatedAt), today = d.toDateString() === new Date().toDateString();
    return (today ? 'reçues aujourd’hui à ' : 'reçues le ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' à ') + hhmm(d);
  }

  function render() {
    renderGrid();
    renderSettings(false);
    renderStatus();
  }

  /* ================================================================== */
  /* Focus, screens and navigation                                       */
  /* ================================================================== */
  var lastFocusKey = { home: null, panel: 'cat:display' };
  function scopeName() { return panelOpen ? 'panel' : 'home'; }
  function scopeEl() { return panelOpen ? $('settings') : $('home'); }
  function navItems() { return Array.prototype.slice.call(scopeEl().querySelectorAll('[data-nav]')); }
  function clipOf(el) { return el.closest ? el.closest('.window') : null; }

  function focusEl(el, fromKeys) {
    if (!el) return;
    el.focus({ preventScroll: true });
    var key = el.getAttribute('data-key');
    lastFocusKey[scopeName()] = key;
    var gi = gridItems.indexOf(el);
    if (fromKeys && gi >= 0) setPage(pageOf(gi));
    if (panelOpen) {
      if (el.classList.contains('cat')) selectCat(el.getAttribute('data-id'));
      else if (rowsBox.contains(el)) lastRowKey[cat] = key;
      updatePos();
    }
  }

  /* Default home focus: the last input if shown, else the first channel of
     the page. Settings: the last element used, else the current category. */
  function restoreFocus() {
    if (panelOpen) { restoreSettingsFocus(); return; }
    var key = lastFocusKey[scopeName()], items = navItems(), target = null;
    for (var i = 0; key && i < items.length; i++) {
      if (items[i].getAttribute('data-key') === key) { target = items[i]; break; }
    }
    if (!target && !panelOpen) {
      var last = lastSource && srcEls[lastSource];
      target = last && gridItems.indexOf(last) >= 0 ? last : gridItems[page * PER_PAGE];
    }
    focusEl(target || items[0], true);
  }

  function setPanel(open) {
    if (open === panelOpen) return;
    panelOpen = open;
    disarmReset();
    setClass(document.body, 'open', open);
    if (open) renderSettings(false);
    restoreFocus();
    requestIcons();
  }

  /* True when the element's centre lies inside its clipping box. */
  function visibleIn(el, box) {
    var r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return cx > b.left && cx < b.right && cy > b.top && cy < b.bottom;
  }

  /* Arrow keys. In the grid, movement follows the cells: left/right cross
     to the neighbouring page at the edges, down from the bottom (or from
     above an empty cell) reaches the round buttons. Elsewhere the closest
     element in that direction wins. */
  function move(dir) {
    if (panelOpen) { moveSettings(dir); return; }
    var cur = document.activeElement, items = navItems();
    if (items.indexOf(cur) < 0) { restoreFocus(); return; }

    var i = gridItems.indexOf(cur);
    if (i >= 0) {
      var n = gridItems.length, p = pageOf(i), r = Math.floor((i % PER_PAGE) / COLS), c = i % COLS, t = -1;
      if (dir === 'left') {
        if (c > 0) t = i - 1;
        else if (p > 0) t = (p - 1) * PER_PAGE + r * COLS + COLS - 1;       // previous pages are full
      } else if (dir === 'right') {
        if (c < COLS - 1) t = i + 1 < n ? i + 1 : -1;
        else if ((p + 1) * PER_PAGE < n) t = Math.min(n - 1, (p + 1) * PER_PAGE + r * COLS);
      } else if (dir === 'up') {
        if (r > 0) t = i - COLS;
      } else {
        if (r < ROWS - 1 && i + COLS < n) t = i + COLS;
        else { spatial(dir, cur, Array.prototype.slice.call($('bar').querySelectorAll('[data-nav]'))); return; }
      }
      if (t >= 0) focusEl(gridItems[t], true);
      return;
    }
    // The two round buttons, like the console: left/right cycle between them
    // (never into the grid), up returns to the nearest channel shown on the
    // current page, down goes nowhere.
    var orbs = [$('orbHome'), $('orbSettings')], o = orbs.indexOf(cur);
    if (o >= 0) {
      if (dir === 'left' || dir === 'right') focusEl(orbs[1 - o], true);
      else if (dir === 'up') {
        var shown = gridItems.slice(page * PER_PAGE, (page + 1) * PER_PAGE);
        if (shown.length) spatial('up', cur, shown);
      }
      return;
    }
    spatial(dir, cur, items);
  }

  function spatial(dir, cur, items) {
    var r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var curBox = clipOf(cur), best = null, bestScore = Infinity;
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      if (el === cur) continue;
      var box = clipOf(el);
      if (box && box !== curBox && !visibleIn(el, box)) continue;   // never jump into a hidden page or row
      var q = el.getBoundingClientRect();
      var dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy, main, cross;
      if (dir === 'left') { main = -dx; cross = Math.abs(dy); }
      else if (dir === 'right') { main = dx; cross = Math.abs(dy); }
      else if (dir === 'up') { main = -dy; cross = Math.abs(dx); }
      else { main = dy; cross = Math.abs(dx); }
      if (main <= 1) continue;
      var score = main + cross * 2;
      if (score < bestScore) { bestScore = score; best = el; }
    }
    if (best) focusEl(best, true);
  }

  /* Page keys (P+/P−, PageUp/PageDown): one page at a time. */
  function pageKey(delta) {
    if (panelOpen) { settingsPage(delta); return; }
    var gi = gridItems.indexOf(document.activeElement);
    if (gi < 0) { turnPage(delta); return; }
    focusEl(gridItems[Math.max(0, Math.min(gridItems.length - 1, gi + delta * PER_PAGE))], true);
  }

  /* ================================================================== */
  /* Actions                                                             */
  /* ================================================================== */
  var pendingOk = null;   // message to show when {"t":"ok"} arrives

  function launchApp(id) {
    var name = nameOf(id);
    if (send({ t: 'launch', id: id })) { pendingOk = name + ' est ouvert.'; toast('Ouverture de ' + name + '…'); }
    else toast('Hors ligne : impossible d’ouvrir ' + name + ' pour l’instant.', true);
  }

  function selectSource(id) {
    var name = nameOf(id);
    if (send({ t: 'source', id: id })) {
      pendingOk = 'Vous êtes sur ' + name + '.';
      rememberSource(id);
      render();
      toast('Passage sur ' + name + '…');
    } else {
      toast('Hors ligne : impossible de passer sur ' + name + ' pour l’instant.', true);
    }
  }

  /* Apply a setting locally at once; send it, or queue it for the next
     connection. Returns true when it was sent. */
  function changeSetting(key, value) {
    model.settings[key] = value;
    persistModel();
    var sent = send({ t: 'setting', key: key, value: value });
    if (sent) delete pendingSettings[key]; else pendingSettings[key] = value;
    save(PENDING_KEY, pendingSettings);
    render();
    return sent;
  }

  function feedback(text, sent) { toast(text + (sent ? '' : ' (envoyé à la reconnexion)')); }

  function toggleHidden(id) {
    var hidden = model.settings.hidden.slice(), at = hidden.indexOf(id);
    if (at >= 0) hidden.splice(at, 1); else hidden.push(id);
    feedback(nameOf(id) + (at >= 0 ? ' : affichée' : ' : masquée'), changeSetting('hidden', hidden));
  }

  function disarmReset() {
    clearTimeout(resetTimer);
    resetTimer = 0;
    if (resetArmed) { resetArmed = false; renderSettings(false); }
  }

  /* Reset needs two presses. It clears the local preferences and the
     offline queue, then sends the defaults so the server agrees. The cached
     tile list stays, so the screen is never empty. */
  function reset() {
    if (!resetArmed) {
      resetArmed = true;
      renderSettings(false);
      resetTimer = setTimeout(disarmReset, 5000);
      return;
    }
    disarmReset();
    pendingSettings = {};
    forget(PENDING_KEY);
    lastSource = null;
    forget(LAST_KEY);
    var a = changeSetting('autoSwitch', false), b = changeSetting('hidden', []);
    feedback('Préférences remises par défaut', a && b);
  }

  /* Home button: back to page 1, on its first channel (like the console's
     home). With no channel shown, the usual default focus. */
  function goHome() {
    lastFocusKey.home = null;
    setPage(0);
    if (gridItems.length) focusEl(gridItems[0], true);
    else restoreFocus();
  }

  function activate(el) {
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act !== 'reset') disarmReset();
    if (act === 'launch') launchApp(id);
    else if (act === 'source') selectSource(id);
    else if (act === 'open') setPanel(true);
    else if (act === 'close') setPanel(false);
    else if (act === 'done') {
      var n = Object.keys(pendingSettings).length;
      setPanel(false);
      toast(n ? 'Réglages enregistrés, envoyés à la reconnexion.' : 'Réglages enregistrés.');
    }
    else if (act === 'cat-enter') { selectCat(id); enterRows('first'); }
    else if (act === 'go-cat') { selectCat(id); enterRows('first'); }
    else if (act === 'set-prev') settingsPage(-1);
    else if (act === 'set-next') settingsPage(1);
    else if (act === 'home') goHome();
    else if (act === 'page-prev') turnPage(-1);
    else if (act === 'page-next') turnPage(1);
    else if (act === 'toggle-auto') {
      var on = !model.settings.autoSwitch;
      feedback('Démarrer sur la dernière entrée : ' + (on ? 'activé' : 'désactivé'), changeSetting('autoSwitch', on));
    }
    else if (act === 'cycle-theme') cycleTheme();
    else if (act === 'toggle-hidden') toggleHidden(id);
    else if (act === 'show-all') feedback('Tout est de nouveau affiché', changeSetting('hidden', []));
    else if (act === 'reset') reset();
  }

  /* ================================================================== */
  /* Toast (one element, one timer)                                      */
  /* ================================================================== */
  var toastEl = $('toast'), toastTimer = 0;
  function toast(msg, isError) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.className = 'show' + (isError ? ' err' : '');
    toastTimer = setTimeout(function () { toastTimer = 0; toastEl.className = isError ? 'err' : ''; }, isError ? 5000 : 2600);
  }

  /* ================================================================== */
  /* WebSocket: one socket at a time, guarded timers, retry every 3 s    */
  /* ================================================================== */
  var conn = { ws: null, state: 'connecting', retryTimer: 0, openTimer: 0 };

  function setConn(state) {
    if (conn.state === state) return;
    conn.state = state;
    if (state === 'online') {   // icons that failed while the server was down get another chance
      Object.keys(icons).forEach(function (u) { if (icons[u] === 'fail') delete icons[u]; });
      requestIcons();
    }
    render();
  }

  function connect() {
    clearTimeout(conn.retryTimer);
    conn.retryTimer = 0;
    if (conn.ws) return;
    if (conn.state !== 'offline') setConn('connecting');   // stay "hors ligne" while retrying
    var ws;
    try { ws = new WebSocket(WS_URL); } catch (e) { setConn('offline'); scheduleRetry(); return; }
    conn.ws = ws;
    clearTimeout(conn.openTimer);
    conn.openTimer = setTimeout(function () {
      conn.openTimer = 0;
      if (conn.ws === ws && ws.readyState !== 1) drop(ws);
    }, CONNECT_TIMEOUT_MS);
    ws.onopen = function () {
      if (conn.ws !== ws) return;
      clearTimeout(conn.openTimer);
      conn.openTimer = 0;
      setConn('online');
    };
    ws.onmessage = function (ev) { if (conn.ws === ws) onMessage(ev.data); };
    ws.onclose = function () { if (conn.ws === ws) drop(ws); };
    ws.onerror = function () { /* "close" always follows */ };
  }

  /* Tear a socket down completely (handlers detached so nothing leaks). */
  function drop(ws) {
    ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
    try { ws.close(); } catch (e) { /* already closed */ }
    if (conn.ws === ws) conn.ws = null;
    clearTimeout(conn.openTimer);
    conn.openTimer = 0;
    pendingOk = null;
    setConn('offline');
    scheduleRetry();
  }

  function scheduleRetry() {
    if (conn.retryTimer) return;
    conn.retryTimer = setTimeout(function () { conn.retryTimer = 0; connect(); }, RETRY_MS);
  }

  function send(obj) {
    if (!conn.ws || conn.ws.readyState !== 1) return false;
    try { conn.ws.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
  }

  function onMessage(raw) {
    var msg;
    try { msg = JSON.parse(raw); } catch (e) { return; }
    if (!msg || typeof msg !== 'object') return;

    if (msg.t === 'state') {
      var apps = cleanApps(msg.apps), sources = cleanSources(msg.sources);
      if (apps) model.apps = apps;
      if (sources) model.sources = sources;
      model.current = typeof msg.current === 'string' ? msg.current : null;
      model.settings = cleanSettings(msg.settings, model.settings);
      model.updatedAt = Date.now();
      if (model.current) rememberSource(model.current);
      flushPendingSettings();   // offline edits win over the snapshot, then get sent
      persistModel();
      render();
    } else if (msg.t === 'ok') {
      if (pendingOk) toast(pendingOk);
      pendingOk = null;
    } else if (msg.t === 'error') {
      toast('Cela n’a pas marché : ' + (str(msg.message) || 'erreur inconnue') + '.', true);
      pendingOk = null;
    }
  }

  function flushPendingSettings() {
    var keys = Object.keys(pendingSettings);
    keys.forEach(function (k) {
      var v = pendingSettings[k];
      model.settings = cleanSettings(k === 'autoSwitch' ? { autoSwitch: v } : { hidden: v }, model.settings);
      if (send({ t: 'setting', key: k, value: v })) delete pendingSettings[k];
    });
    if (keys.length) { save(PENDING_KEY, pendingSettings); toast('Réglages en attente envoyés.'); }
  }

  /* ================================================================== */
  /* Bar: clock, date, status                                            */
  /* ================================================================== */
  var clockTimer = 0, lastClock = '';

  function tick() {
    clearTimeout(clockTimer);
    var now = new Date(), c = now.getHours() + ':' + now.getMinutes();
    if (c !== lastClock) {
      lastClock = c;
      var hr = now.getHours(), suffix = '';
      if (CLOCK_12H) { suffix = hr < 12 ? 'AM' : 'PM'; hr = hr % 12 || 12; }
      var clock = $('clock');
      clock.textContent = '';
      clock.appendChild(document.createTextNode(String(hr)));
      clock.appendChild(h('span', { className: 'sep', text: ':' }));
      clock.appendChild(document.createTextNode(pad2(now.getMinutes())));
      if (suffix) clock.appendChild(h('small', { text: suffix }));
      var day = now.getDate();
      setText($('date'), cap(DAYS[now.getDay()]) + ' ' + (day === 1 ? '1er' : day) + ' ' + MONTHS[now.getMonth()]);
      lastStatus = '';           // "aujourd'hui" may have become "le 8 novembre"
      renderStatus();
    }
    // Re-align on the next minute boundary each time, so drift never builds up.
    clockTimer = setTimeout(tick, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 20);
  }

  var lastStatus = '';
  function renderStatus() {
    var st = conn.state;
    var text = st === 'online' ? 'en ligne' : st === 'connecting' ? 'connexion…' : 'hors ligne · données ' + dataAge();
    var key = st + '|' + text;
    if (key === lastStatus) return;
    lastStatus = key;
    ['status', 'status2'].forEach(function (id) {
      var el = $(id);
      el.className = 'status ' + st;
      setText(el.querySelector('.st'), id === 'status2' && st === 'offline' ? 'hors ligne' : text);
    });
    renderSettings(false);
  }

  /* ================================================================== */
  /* Input: keys, pointer, wheel                                         */
  /* ================================================================== */
  var ARROWS = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };
  var BACK_CODES = [8, 27, 461, 10009];        // Backspace / Esc + common TV back codes
  var BACK_KEYS = ['Backspace', 'Escape', 'GoBack', 'BrowserBack'];
  var MENU_CODES = [93, 457];                  // ContextMenu, "Info" on some remotes
  var MENU_KEYS = ['ContextMenu', 'Menu', 'Settings', 'm', 'M'];
  var PAGE_CODES = { 33: -1, 34: 1, 427: -1, 428: 1 };   // PageUp/Down, Channel +/−

  document.addEventListener('keydown', function (e) {
    var code = e.keyCode, key = e.key;
    if (ARROWS[code]) { e.preventDefault(); move(ARROWS[code]); }
    else if (PAGE_CODES[code]) { e.preventDefault(); pageKey(PAGE_CODES[code]); }
    else if (code === 13) {
      // A focused <button> turns Enter into a click by itself; only recover lost focus.
      if (navItems().indexOf(document.activeElement) < 0) { e.preventDefault(); restoreFocus(); }
    } else if (BACK_CODES.indexOf(code) >= 0 || BACK_KEYS.indexOf(key) >= 0) {
      e.preventDefault();                      // never let the browser navigate away
      setPanel(false);
    } else if (MENU_CODES.indexOf(code) >= 0 || MENU_KEYS.indexOf(key) >= 0) {
      e.preventDefault();
      setPanel(!panelOpen);
    }
  });

  // Pointer: focus follows the cursor, a click (OK) activates.
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest ? e.target.closest('[data-nav]') : null;
    if (el && el !== document.activeElement && scopeEl().contains(el)) focusEl(el, false);
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (el && scopeEl().contains(el)) activate(el);
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // Pointer-only buttons (page arrows) never take the focus from the remote's position.
  document.addEventListener('mousedown', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (el && !el.hasAttribute('data-nav')) e.preventDefault();
  });

  // Wheel over the settings panel turns one page of rows per notch (throttled).
  $('setPanel').addEventListener('wheel', function (e) {
    e.preventDefault();
    var now = Date.now(), d = e.deltaY || e.deltaX;
    if (now - lastWheel < 350 || !d) return;
    lastWheel = now;
    settingsPage(d > 0 ? 1 : -1);
  }, { passive: false });

  // Wheel over the channels turns one page per notch (throttled).
  var lastWheel = 0;
  $('appWindow').addEventListener('wheel', function (e) {
    e.preventDefault();
    var now = Date.now(), d = e.deltaY || e.deltaX;
    if (now - lastWheel < 350 || !d) return;
    lastWheel = now;
    turnPage(d > 0 ? 1 : -1);
  }, { passive: false });

  /* No resize handler: every size is in rem and the root font size follows
     the viewport in CSS, so the browser re-lays the page out on its own. */

  /* When the TV wakes the page, refresh the clock and reconnect at once. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    tick();
    if (!conn.ws) connect();
  });

  /* ================================================================== */
  /* ?config= override (kept from v1)                                    */
  /*   ?config={"apps":[...]}   inline JSON (URL-encoded)                */
  /*   ?config=apps.json        file next to this page, loaded by XHR    */
  /* ================================================================== */
  function applyOverride(obj) {
    if (!obj || typeof obj !== 'object') return;
    var apps = cleanApps(obj.apps), sources = cleanSources(obj.sources);
    if (!apps && !sources) return;
    override = { apps: apps, sources: sources };
    render();
  }

  function loadOverride() {
    var m = /[?&]config=([^&#]*)/.exec(window.location.search);
    if (!m) return;
    var value;
    try { value = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return; }
    if (value.charAt(0) === '{') {
      try { applyOverride(JSON.parse(value)); } catch (e) { toast('Configuration illisible.', true); }
      return;
    }
    if (!safeIcon(value)) { toast('Configuration ignorée : fichier local seulement.', true); return; }
    var xhr = new XMLHttpRequest();
    xhr.timeout = 5000;
    xhr.onload = function () {
      try { applyOverride(JSON.parse(xhr.responseText)); } catch (e) { toast('Configuration illisible : ' + value, true); }
    };
    xhr.onerror = xhr.ontimeout = function () { toast('Configuration introuvable : ' + value, true); };
    try { xhr.open('GET', value, true); xhr.send(); } catch (e) { /* bad URL */ }
  }

  /* ================================================================== */
  /* Boot                                                                */
  /* ================================================================== */
  tick();
  render();          // cached or default data first: never a blank screen
  restoreFocus();
  loadOverride();
  connect();
})();
</script>
</body>
</html>
