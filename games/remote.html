<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Attrape les étoiles</title>
<!--
  Attrape les étoiles — jeu pour la télécommande (flèches gauche/droite + OK).
  Un petit robot se déplace sur 5 couloirs et attrape les étoiles qui tombent.
  12 étoiles remplissent la rangée en haut de l'écran : c'est gagné.
  Aucune pénalité : une étoile ratée fait juste « pouf ».

  Entrées acceptées :
    - flèches (keydown) : gauche/droite changent de couloir, OK fait sauter le robot ;
    - pointeur (mode souris de la télécommande) : le robot suit le pointeur, le clic = OK.
  Fichier autonome : pas de dépendance, pas d'image, sons synthétisés avec WebAudio.
-->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b0f2e; color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Verdana, Arial, sans-serif;
  }
  /* Scène logique 1920x1080, mise à l'échelle par fit() */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }

  .screen {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    display: none; flex-direction: column; align-items: center; justify-content: flex-start;
    box-sizing: border-box;
  }
  .screen.on { display: flex; }
  #start { background: rgba(10, 14, 50, 0.30); padding-top: 70px; }
  #win { background: rgba(10, 14, 50, 0.35); justify-content: center; padding-bottom: 260px; }

  h1 {
    font-size: 120px; margin: 0 0 30px; color: #ffe14d; letter-spacing: 2px;
    text-shadow: 0 8px 0 #2b2f8a, 0 0 40px rgba(255, 220, 80, 0.6);
  }
  .hint { display: flex; align-items: center; gap: 50px; margin-bottom: 50px; }
  .row { display: flex; align-items: center; gap: 70px; }

  /* Gros boutons. Pas de <button> : aucune activation clavier native, on gère tout nous-mêmes. */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 30px;
    min-width: 520px; height: 200px; padding: 0 70px; box-sizing: border-box;
    border-radius: 100px; background: #ff5a8a; color: #fff;
    font-size: 100px; font-weight: bold; cursor: pointer;
    box-shadow: 0 16px 0 #b8325d, 0 24px 40px rgba(0, 0, 0, 0.4);
    transition: transform 0.15s;
  }
  .btn.green { background: #3ccf6e; box-shadow: 0 16px 0 #23894a, 0 24px 40px rgba(0, 0, 0, 0.4); }
  .btn.blue { background: #4aa8ff; box-shadow: 0 16px 0 #2a6cb0, 0 24px 40px rgba(0, 0, 0, 0.4); min-width: 240px; padding: 0 50px; }
  .btn.sel { outline: 14px solid #fff; outline-offset: 10px; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1.08); } 50% { transform: scale(1.16); } }

  .corner {
    position: absolute; top: 28px; width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.18); display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #home { left: 28px; display: none; }
  #home.on { display: flex; }
  #mute { right: 28px; }
  #mute .off { display: none; }
  #mute.muted { background: rgba(255, 80, 80, 0.45); }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: block; }

  /* « BRAVO ! » qui sautille lettre par lettre */
  .bravo { font-size: 200px; }
  .bravo span { display: inline-block; animation: hop 0.9s ease-in-out infinite; }
  .bravo span:nth-child(2) { animation-delay: 0.1s; }
  .bravo span:nth-child(3) { animation-delay: 0.2s; }
  .bravo span:nth-child(4) { animation-delay: 0.3s; }
  .bravo span:nth-child(5) { animation-delay: 0.4s; }
  .bravo span:nth-child(7) { animation-delay: 0.5s; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-50px) rotate(-6deg); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>

  <!-- Écran d'accueil : un titre, un dessin des flèches, un gros bouton JOUER -->
  <div id="start" class="screen on">
    <h1>Attrape les étoiles !</h1>
    <div class="hint">
      <svg width="170" height="130" viewBox="0 0 170 130"><rect x="5" y="5" width="160" height="120" rx="40" fill="#4aa8ff"/><path d="M110 25 L45 65 L110 105 Z" fill="#fff"/></svg>
      <svg width="150" height="150" viewBox="0 0 100 100"><path d="M50 4 L62 36 L96 37 L69 58 L79 92 L50 72 L21 92 L31 58 L4 37 L38 36 Z" fill="#ffd93b" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
      <svg width="170" height="130" viewBox="0 0 170 130"><rect x="5" y="5" width="160" height="120" rx="40" fill="#4aa8ff"/><path d="M60 25 L125 65 L60 105 Z" fill="#fff"/></svg>
    </div>
    <div class="btn" data-action="play">
      <svg width="100" height="100" viewBox="0 0 100 100"><path d="M25 12 L88 50 L25 88 Z" fill="#fff"/></svg>
      JOUER
    </div>
  </div>

  <!-- Écran de victoire : REJOUER (présélectionné) et la maison -->
  <div id="win" class="screen">
    <h1 class="bravo"><span>B</span><span>R</span><span>A</span><span>V</span><span>O</span> <span>!</span></h1>
    <div class="row">
      <div class="btn green" data-action="again">
        <svg width="110" height="110" viewBox="0 0 100 100"><path d="M50 16 A34 34 0 1 1 16 50" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/><path d="M0 54 L32 54 L16 28 Z" fill="#fff"/></svg>
        REJOUER
      </div>
      <div class="btn blue" data-action="home">
        <svg width="120" height="120" viewBox="0 0 100 100"><path d="M50 10 L94 50 L80 50 L80 90 L60 90 L60 66 L40 66 L40 90 L20 90 L20 50 L6 50 Z" fill="#fff"/></svg>
      </div>
    </div>
  </div>

  <!-- Coins : maison (pendant le jeu) et son -->
  <div id="home" class="corner">
    <svg width="80" height="80" viewBox="0 0 100 100"><path d="M50 10 L94 50 L80 50 L80 90 L60 90 L60 66 L40 66 L40 90 L20 90 L20 50 L6 50 Z" fill="#fff"/></svg>
  </div>
  <div id="mute" class="corner">
    <svg class="on" width="84" height="84" viewBox="0 0 100 100"><path d="M8 36 L28 36 L52 14 L52 86 L28 64 L8 64 Z" fill="#fff"/><path d="M64 34 Q74 50 64 66 M74 22 Q92 50 74 78" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>
    <svg class="off" width="84" height="84" viewBox="0 0 100 100"><path d="M8 36 L28 36 L52 14 L52 86 L28 64 L8 64 Z" fill="#fff"/><path d="M64 36 L92 64 M92 36 L64 64" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================================================================
     Constantes du jeu
     ================================================================ */
  var W = 1920, H = 1080;
  var GOAL = 12;                       // étoiles à attraper pour gagner
  var LANES = 5, LANE_W = 300;
  var LANE_X0 = W / 2 - 2 * LANE_W;    // centre du couloir 0
  var GROUND_Y = 950;                  // sol (pieds du robot)
  var CATCH_TOP = 590, CATCH_BOT = 900;// zone où une étoile peut être attrapée
  var CATCH_DX = 150;                  // tolérance horizontale (un demi-couloir)
  var SLOT_Y = 95, SLOT_DX = 112;      // rangée d'étoiles à remplir (objectif)
  var HOP_DUR = 0.45;                  // durée d'un petit saut du robot
  var STEP = 1 / 60;                   // pas fixe de la simulation

  var STAR_COLS = ['#ffd93b', '#ff7eb6', '#5ee0ff', '#8dff6a', '#ffa94d'];
  var CONF_COLS = ['#ffd93b', '#ff7eb6', '#5ee0ff', '#8dff6a', '#ffa94d', '#b18cff', '#ffffff'];
  // Gamme pentatonique montante : chaque étoile attrapée sonne un peu plus haut
  var NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760, 2093, 2349.32];

  /* ================================================================
     Outils
     ================================================================ */
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function laneX(l) { return LANE_X0 + l * LANE_W; }
  function slotX(i) { return W / 2 + (i - (GOAL - 1) / 2) * SLOT_DX; }
  function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function makeCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  /* ================================================================
     Mise à l'échelle : la scène 1920x1080 tient dans la fenêtre (bandes si besoin)
     ================================================================ */
  var stage = $('stage'), cv = $('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var scale = 1, offX = 0, offY = 0;
  function fit() {
    var iw = window.innerWidth || W, ih = window.innerHeight || H;
    scale = Math.min(iw / W, ih / H);
    offX = (iw - W * scale) / 2;
    offY = (ih - H * scale) / 2;
    stage.style.transform = 'translate(' + offX + 'px,' + offY + 'px) scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ================================================================
     Son (WebAudio) : créé au premier geste, coupé avec le bouton / la touche M
     ================================================================ */
  var AC = null, master = null, muted = false;
  try { muted = window.localStorage.getItem('etoiles-muet') === '1'; } catch (e) { /* stockage indisponible */ }

  function initAudio() {
    if (AC) {
      if (AC.state === 'suspended' && !document.hidden) { try { AC.resume(); } catch (e) { /* rien */ } }
      return;
    }
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(AC.destination);
    } catch (e) { AC = null; }
  }

  // Une note simple avec enveloppe ; slideTo fait glisser la hauteur.
  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!AC || muted || AC.state !== 'running') return;
    try {
      var t = AC.currentTime + (delay || 0);
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) { /* son indisponible : on continue sans */ }
  }
  function sfxMove() { tone(620, 0.07, 'sine', 0.12); }
  function sfxCatch(i) { var f = NOTES[clamp(i, 0, NOTES.length - 1)]; tone(f, 0.28, 'triangle', 0.3); tone(f * 2, 0.15, 'sine', 0.08, 0.03); }
  function sfxFill() { tone(1600, 0.09, 'sine', 0.08, 0, 2400); }
  function sfxPouf() { tone(240, 0.2, 'sine', 0.1, 0, 110); }
  function sfxHop() { tone(260, 0.22, 'triangle', 0.2, 0, 640); }
  function sfxSelect() { tone(880, 0.06, 'sine', 0.12); }
  function sfxConfirm() { tone(660, 0.1, 'triangle', 0.25); tone(990, 0.18, 'triangle', 0.25, 0.09); }
  function sfxWin() {
    var seq = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    for (var i = 0; i < seq.length; i++) tone(seq[i], 0.3, 'triangle', 0.28, i * 0.13);
    tone(1318.51, 0.7, 'triangle', 0.25, 0.8);
    tone(659.25, 0.7, 'sine', 0.15, 0.8);
  }

  var muteBtn = $('mute');
  function paintMute() { muteBtn.classList.toggle('muted', muted); }
  function toggleMute() {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.5;
    try { window.localStorage.setItem('etoiles-muet', muted ? '1' : '0'); } catch (e) { /* rien */ }
    paintMute();
    if (!muted) sfxSelect();
  }
  paintMute();

  /* ================================================================
     Images pré-rendues (une seule fois) : fond, étoiles
     ================================================================ */
  function starPath(g, cx, cy, R, r) {
    g.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rad = (i % 2) ? r : R;
      var x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath();
  }

  // Étoile avec un petit visage souriant. rainbow = grosse étoile arc-en-ciel.
  function makeStar(color, size, rainbow) {
    var c = makeCanvas(size, size), g = c.getContext('2d'), s = size / 2;
    starPath(g, s, s, s * 0.8, s * 0.38);
    if (rainbow) {
      var gr = g.createLinearGradient(0, 0, size, size);
      gr.addColorStop(0, '#ff5a8a'); gr.addColorStop(0.3, '#ffd93b');
      gr.addColorStop(0.6, '#8dff6a'); gr.addColorStop(1, '#5ee0ff');
      g.fillStyle = gr;
    } else {
      g.fillStyle = color;
    }
    g.shadowColor = rainbow ? '#ffffff' : color;
    g.shadowBlur = size * 0.1;
    g.fill();
    g.shadowBlur = 0;
    g.lineJoin = 'round'; g.lineWidth = size * 0.04; g.strokeStyle = 'rgba(255,255,255,0.85)';
    g.stroke();
    // visage
    g.fillStyle = '#3a2a10';
    g.beginPath(); g.arc(s - s * 0.15, s - s * 0.02, s * 0.06, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(s + s * 0.15, s - s * 0.02, s * 0.06, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#3a2a10'; g.lineWidth = s * 0.05; g.lineCap = 'round';
    g.beginPath(); g.arc(s, s + s * 0.06, s * 0.13, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    return c;
  }
  function makeEmptySlot(size) {
    var c = makeCanvas(size, size), g = c.getContext('2d'), s = size / 2;
    starPath(g, s, s, s * 0.8, s * 0.38);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    g.lineJoin = 'round'; g.lineWidth = 5; g.strokeStyle = 'rgba(255,255,255,0.5)'; g.stroke();
    return c;
  }

  var STAR_SIZE = 150, BIG_SIZE = 210, SLOT_SIZE = 96;
  var starSprites = [];
  for (var si = 0; si < STAR_COLS.length; si++) starSprites.push(makeStar(STAR_COLS[si], STAR_SIZE, false));
  var bigSprite = makeStar('#fff', BIG_SIZE, true);
  var emptySlot = makeEmptySlot(SLOT_SIZE);

  // Fond : ciel, lune, collines, sol avec 5 « pastilles » qui montrent les couloirs
  var bg = makeCanvas(W, H);
  (function paintBackground() {
    var g = bg.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#141a52'); gr.addColorStop(0.6, '#3b3f9e'); gr.addColorStop(1, '#7a62d6');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // lune
    g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(1720, 320, 72, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#efdc9c';
    g.beginPath(); g.arc(1700, 300, 14, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(1745, 345, 10, 0, Math.PI * 2); g.fill();
    // collines lointaines puis proches
    var layer, x;
    var cols = ['#28337a', '#2c5b7a'];
    for (layer = 0; layer < 2; layer++) {
      g.fillStyle = cols[layer];
      g.beginPath(); g.moveTo(0, H);
      for (x = 0; x <= W; x += 40) {
        var base = layer === 0 ? 800 : 870;
        g.lineTo(x, base - Math.sin(x * 0.004 + layer * 2) * 60 - Math.sin(x * 0.011 + 1) * 25);
      }
      g.lineTo(W, H); g.closePath(); g.fill();
    }
    // sol
    g.fillStyle = '#2f8f55'; g.fillRect(0, GROUND_Y - 12, W, H - GROUND_Y + 12);
    g.fillStyle = '#3fb26b'; g.fillRect(0, GROUND_Y - 12, W, 34);
    // pastilles de couloir
    g.fillStyle = 'rgba(255,255,255,0.18)';
    for (var l = 0; l < LANES; l++) {
      g.beginPath(); g.ellipse(laneX(l), GROUND_Y + 40, 110, 22, 0, 0, Math.PI * 2); g.fill();
    }
  })();

  // Petites étoiles scintillantes du ciel (positions fixes, tableaux typés)
  var TW_N = 70, twX = new Float32Array(TW_N), twY = new Float32Array(TW_N), twP = new Float32Array(TW_N);
  for (var ti = 0; ti < TW_N; ti++) { twX[ti] = Math.random() * W; twY[ti] = 180 + Math.random() * 560; twP[ti] = Math.random() * 6.28; }

  /* ================================================================
     Pools d'objets (aucune allocation pendant le jeu)
     ================================================================ */
  var STAR_MAX = 12, stars = [];
  for (var i0 = 0; i0 < STAR_MAX; i0++) stars.push({ on: false, x: 0, y: 0, vy: 0, col: 0, big: false, rot: 0, spin: 0, ph: 0 });

  var FLY_MAX = 8, flyers = [];   // étoiles attrapées qui volent vers leur case en haut
  for (var i1 = 0; i1 < FLY_MAX; i1++) flyers.push({ on: false, t: 0, dur: 0.7, x0: 0, y0: 0, slot: 0, col: 0 });

  var PMAX = 400, parts = [], pNext = 0;   // particules en anneau : la plus vieille est recyclée
  for (var i2 = 0; i2 < PMAX; i2++) parts.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, col: '#fff', size: 10, kind: 0, rot: 0, vr: 0, g: 0 });

  function emit(x, y, vx, vy, life, col, size, kind, grav) {
    var p = parts[pNext]; pNext = (pNext + 1) % PMAX;
    p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life;
    p.col = col; p.size = size; p.kind = kind; p.g = grav;
    p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 10;
  }
  function burst(x, y, n, col) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 200 + Math.random() * 500;
      emit(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 200, 0.6 + Math.random() * 0.4,
        col || CONF_COLS[i % CONF_COLS.length], 8 + Math.random() * 12, 0, 900);
    }
  }
  function confetti(n) {
    for (var i = 0; i < n; i++) {
      emit(Math.random() * W, -20 - Math.random() * 200, (Math.random() - 0.5) * 200, 150 + Math.random() * 250,
        4 + Math.random() * 2, CONF_COLS[randInt(0, CONF_COLS.length - 1)], 16 + Math.random() * 14, 1, 120);
    }
  }

  /* ================================================================
     État du jeu
     ================================================================ */
  var state = 'start';               // 'start' | 'play' | 'celebrate' | 'win'
  var T = 0;                         // temps de jeu (s)
  var robot = { lane: 4, x: laneX(4), vx: 0, hopT: 0, happyT: 0, wheel: 0 };
  var reserved = 0;                  // cases réservées (étoiles attrapées, en vol ou arrivées)
  var filledCount = 0;               // cases réellement remplies
  var slotFilled = new Uint8Array(GOAL), slotCol = new Int8Array(GOAL), slotPop = new Float32Array(GOAL);
  var spawned = 0, spawnT = 0, sinceCatch = 0, taught = false, celebrateT = 0, confT = 0;
  var lastKeyMove = 0;               // anti-répétition trop rapide des flèches
  var keyboardUntil = 0;             // après une flèche, le pointeur ne pilote plus le robot un moment
  var actLock = 0;                   // empêche une double activation (OK + clic, ou appui juste à l'apparition)

  function moveLane(d, isRepeat) {
    var t = now();
    keyboardUntil = t + 1500;
    if (isRepeat && t - lastKeyMove < 140) return;   // touche maintenue : ~7 couloirs/s maximum
    lastKeyMove = t;
    var n = clamp(robot.lane + d, 0, LANES - 1);
    taught = true;
    if (n !== robot.lane) { robot.lane = n; sfxMove(); }
  }
  function setLaneFromX(x) {
    if (now() < keyboardUntil) return;
    var n = clamp(Math.round((x - LANE_X0) / LANE_W), 0, LANES - 1);
    if (n !== robot.lane) { robot.lane = n; taught = true; sfxMove(); }
  }
  function hop() {
    if (robot.hopT > 0) return;
    robot.hopT = HOP_DUR;
    sfxHop();
  }

  function clearPlayfield() {
    var i;
    for (i = 0; i < STAR_MAX; i++) stars[i].on = false;
    for (i = 0; i < FLY_MAX; i++) flyers[i].on = false;
    for (i = 0; i < GOAL; i++) { slotFilled[i] = 0; slotPop[i] = 0; }
    reserved = 0; filledCount = 0; spawned = 0; spawnT = 1.2; sinceCatch = 0; celebrateT = 0; confT = 0;
  }

  function startGame() {
    clearPlayfield();
    robot.lane = 2; taught = false;
    state = 'play';
    showScreen(null);
  }
  function goHome() {
    clearPlayfield();
    robot.lane = 4;
    state = 'start';
    showScreen('start');
    actLock = now() + 400;
  }
  function showWin() {
    state = 'win';
    showScreen('win');
    actLock = now() + 900;   // un enfant qui tape sur OK ne relance pas la partie par erreur
  }

  /* ---------------- Étoiles ---------------- */
  function laneBusy(l) {
    for (var i = 0; i < STAR_MAX; i++) {
      var s = stars[i];
      if (s.on && Math.abs(s.x - laneX(l)) < 1 && s.y < 320) return true;
    }
    return false;
  }
  function spawnStar(p) {
    var s = null, i;
    for (i = 0; i < STAR_MAX; i++) if (!stars[i].on) { s = stars[i]; break; }
    if (!s) return;
    var lane;
    if (spawned < 3) {
      // les premières étoiles tombent près du robot : on apprend en douceur
      lane = clamp(robot.lane + randInt(-1, 1), 0, LANES - 1);
    } else {
      lane = randInt(0, LANES - 1);
      for (i = 0; i < 6 && laneBusy(lane); i++) lane = randInt(0, LANES - 1);
    }
    s.on = true; s.x = laneX(lane); s.y = -100;
    s.big = spawned > 4 && Math.random() < 0.12;          // parfois une grosse étoile qui vaut 2
    s.vy = (190 + 210 * p) * (s.big ? 0.8 : 1) * (0.9 + Math.random() * 0.2);
    s.col = randInt(0, STAR_COLS.length - 1);
    s.rot = 0; s.spin = (Math.random() - 0.5) * 2; s.ph = Math.random() * 6.28;
    spawned++;
  }
  function launchFlyer(x, y, col, delay) {
    if (reserved >= GOAL) return;
    var slot = reserved++;
    slotCol[slot] = col;
    for (var i = 0; i < FLY_MAX; i++) {
      var f = flyers[i];
      if (!f.on) { f.on = true; f.t = 0; f.dur = 0.7 + delay; f.x0 = x; f.y0 = y; f.slot = slot; f.col = col; return; }
    }
    // pool plein (improbable) : la case se remplit tout de suite
    slotFilled[slot] = 1; filledCount++; slotPop[slot] = 0.35;
  }
  function catchStar(s) {
    s.on = false;
    sinceCatch = 0;
    robot.happyT = 0.6;
    burst(s.x, s.y, s.big ? 30 : 18, s.big ? null : STAR_COLS[s.col]);
    sfxCatch(reserved);
    if (s.big) { launchFlyer(s.x - 30, s.y, randInt(0, 4), 0); launchFlyer(s.x + 30, s.y, randInt(0, 4), 0.15); }
    else launchFlyer(s.x, s.y, s.col, 0);
  }
  function poufStar(s) {
    s.on = false;
    for (var i = 0; i < 8; i++) emit(s.x + (Math.random() - 0.5) * 60, GROUND_Y - 20, (Math.random() - 0.5) * 200, -100 - Math.random() * 200, 0.5, 'rgba(255,255,255,0.8)', 10, 0, 400);
    sfxPouf();
  }

  /* ================================================================
     Mise à jour (pas fixe)
     ================================================================ */
  function update(dt) {
    var i;
    T += dt;

    // Le robot glisse doucement vers le centre de son couloir
    var tx = laneX(robot.lane);
    var nx = robot.x + (tx - robot.x) * (1 - Math.exp(-dt * 12));
    robot.vx = (nx - robot.x) / dt;
    robot.x = nx;
    robot.wheel += robot.vx * dt / 50;
    if (robot.hopT > 0) robot.hopT = Math.max(0, robot.hopT - dt);
    if (robot.happyT > 0) robot.happyT -= dt;
    for (i = 0; i < GOAL; i++) if (slotPop[i] > 0) slotPop[i] -= dt;

    if (state === 'play') {
      sinceCatch += dt;
      var p = reserved / GOAL;                       // progression 0..1 = difficulté douce
      if (reserved < GOAL) {
        spawnT -= dt;
        if (spawnT <= 0) { spawnStar(p); spawnT = 1.8 - 0.8 * p + Math.random() * 0.4; }
      }
      if (filledCount >= GOAL) {
        state = 'celebrate'; celebrateT = 0; confT = 0;
        sfxWin(); confetti(140);
      }
    } else if (state === 'celebrate' || state === 'win') {
      celebrateT += dt;
      robot.happyT = 0.3;
      if (robot.hopT <= 0) robot.hopT = HOP_DUR;      // le robot danse
      confT -= dt;
      if (celebrateT < 5 && confT <= 0) { confetti(6); confT = 0.12; }
      if (state === 'celebrate' && celebrateT > 1.3) showWin();
    }

    // Étoiles qui tombent
    var canCatch = state === 'play' || state === 'celebrate';
    for (i = 0; i < STAR_MAX; i++) {
      var s = stars[i];
      if (!s.on) continue;
      s.y += s.vy * dt;
      s.rot += s.spin * dt;
      if (canCatch && s.y > CATCH_TOP && s.y < CATCH_BOT && Math.abs(s.x - robot.x) < CATCH_DX) catchStar(s);
      else if (s.y >= GROUND_Y - 25) poufStar(s);
    }

    // Étoiles en vol vers leur case
    for (i = 0; i < FLY_MAX; i++) {
      var f = flyers[i];
      if (!f.on) continue;
      f.t += dt / f.dur;
      if (f.t >= 1) {
        f.on = false;
        slotFilled[f.slot] = 1; filledCount++; slotPop[f.slot] = 0.35;
        burst(slotX(f.slot), SLOT_Y, 10, STAR_COLS[f.col]);
        sfxFill();
      }
    }

    // Particules
    for (i = 0; i < PMAX; i++) {
      var q = parts[i];
      if (!q.on) continue;
      q.life -= dt;
      if (q.life <= 0 || q.y > H + 60) { q.on = false; continue; }
      q.vy += q.g * dt;
      if (q.kind === 1) q.vx += Math.sin(T * 3 + q.rot) * 40 * dt;  // les confettis flottent
      q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    }
  }

  /* ================================================================
     Dessin
     ================================================================ */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

  // Le robot : une roue, un corps avec un cœur, des bras levés pour attraper, une tête-écran.
  function drawRobot(x, lift) {
    var happy = robot.happyT > 0;
    var lean = clamp(robot.vx * 0.0003, -0.25, 0.25);
    var wave = happy ? Math.sin(T * 18) * 25 : Math.sin(T * 2) * 6;
    var blink = (T % 3.3) < 0.12;

    ctx.setTransform(1, 0, 0, 1, x, GROUND_Y);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 6, 110 - lift * 0.4, 18, 0, 0, Math.PI * 2); ctx.fill();

    ctx.translate(0, -lift);
    ctx.rotate(lean);

    // roue
    ctx.fillStyle = '#2d3561'; circle(0, -50, 50);
    ctx.fillStyle = '#8892c8'; circle(0, -50, 20);
    ctx.strokeStyle = '#8892c8'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < 3; i++) {
      var a = robot.wheel + i * 2.094;
      ctx.moveTo(0, -50); ctx.lineTo(Math.cos(a) * 42, -50 + Math.sin(a) * 42);
    }
    ctx.stroke();

    // bras levés (zone d'attrape)
    ctx.strokeStyle = '#2aa898'; ctx.lineWidth = 26;
    ctx.beginPath();
    ctx.moveTo(-85, -185); ctx.lineTo(-150, -290 + wave);
    ctx.moveTo(85, -185); ctx.lineTo(150, -290 - wave);
    ctx.stroke();
    ctx.fillStyle = '#ffd93b';
    circle(-150, -290 + wave, 26); circle(150, -290 - wave, 26);

    // corps
    ctx.fillStyle = '#35c9b5'; rr(-95, -215, 190, 145, 36); ctx.fill();
    ctx.fillStyle = '#2aa898'; rr(-95, -100, 190, 30, 14); ctx.fill();
    // cœur qui bat
    var hb = 1 + Math.sin(T * 6) * 0.08 + (happy ? 0.2 : 0);
    ctx.fillStyle = '#ff5a8a';
    ctx.save(); ctx.translate(0, -150); ctx.scale(hb, hb);
    ctx.beginPath();
    ctx.moveTo(0, 22); ctx.bezierCurveTo(-36, -2, -22, -34, 0, -14); ctx.bezierCurveTo(22, -34, 36, -2, 0, 22);
    ctx.fill(); ctx.restore();

    // tête
    ctx.fillStyle = '#2aa898'; ctx.fillRect(-22, -235, 44, 24);
    ctx.fillStyle = '#5fe0cf'; rr(-92, -345, 184, 120, 40); ctx.fill();
    ctx.fillStyle = '#1d2a4a'; rr(-72, -327, 144, 84, 26); ctx.fill();
    // yeux
    ctx.strokeStyle = '#7dffea'; ctx.fillStyle = '#7dffea'; ctx.lineWidth = 9;
    if (happy) {
      // yeux en « ^ ^ » : deux arcs séparés
      ctx.beginPath(); ctx.arc(-32, -280, 16, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(32, -280, 16, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (blink) {
      ctx.fillRect(-46, -290, 28, 6); ctx.fillRect(18, -290, 28, 6);
    } else {
      circle(-32, -288, 13); circle(32, -288, 13);
    }
    // bouche
    ctx.beginPath(); ctx.arc(0, -268, happy ? 20 : 14, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    // antenne
    ctx.strokeStyle = '#2aa898'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(0, -345); ctx.lineTo(Math.sin(T * 3) * 6, -385); ctx.stroke();
    ctx.fillStyle = ((T * 2) % 1 < 0.5 || happy) ? '#ffe14d' : '#ffb84d';
    circle(Math.sin(T * 3) * 6, -392, 15);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function drawSprite(img, x, y, rot, sc) {
    var c = Math.cos(rot) * sc, s = Math.sin(rot) * sc;
    ctx.setTransform(c, s, -s, c, x, y);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
  }

  // Grosse flèche jaune d'aide (dir = -1 gauche, 1 droite)
  function drawArrow(cx, cy, dir, sc) {
    ctx.setTransform(dir * sc, 0, 0, sc, cx, cy);
    ctx.beginPath();
    ctx.moveTo(-50, -22); ctx.lineTo(10, -22); ctx.lineTo(10, -52); ctx.lineTo(62, 0);
    ctx.lineTo(10, 52); ctx.lineTo(10, 22); ctx.lineTo(-50, 22); ctx.closePath();
    ctx.fillStyle = '#ffe14d'; ctx.fill();
    ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = '#7a5a00'; ctx.stroke();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function render() {
    var i;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0);

    // scintillement du ciel
    ctx.fillStyle = '#ffffff';
    for (i = 0; i < TW_N; i++) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(T * 2 + twP[i]);
      ctx.fillRect(twX[i] - 3, twY[i] - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    var playing = state === 'play';
    // couloir du robot éclairé
    if (playing) {
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(laneX(robot.lane) - LANE_W / 2, 0, LANE_W, GROUND_Y);
    }

    // étoiles qui tombent (petit balancement)
    for (i = 0; i < STAR_MAX; i++) {
      var s = stars[i];
      if (!s.on) continue;
      drawSprite(s.big ? bigSprite : starSprites[s.col], s.x + Math.sin(T * 2 + s.ph) * 14, s.y, s.rot, 1);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    // robot
    var lift = 0;
    if (robot.hopT > 0) lift = Math.sin((1 - robot.hopT / HOP_DUR) * Math.PI) * 90;
    drawRobot(robot.x, lift);

    // étoiles en vol vers la rangée du haut
    for (i = 0; i < FLY_MAX; i++) {
      var f = flyers[i];
      if (!f.on) continue;
      var e = f.t * f.t * (3 - 2 * f.t);
      var fx = f.x0 + (slotX(f.slot) - f.x0) * e;
      var fy = f.y0 + (SLOT_Y - f.y0) * e - Math.sin(Math.PI * f.t) * 150;
      drawSprite(starSprites[f.col], fx, fy, f.t * 6.28, 1 - 0.36 * e);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    // particules
    for (i = 0; i < PMAX; i++) {
      var q = parts[i];
      if (!q.on) continue;
      ctx.globalAlpha = q.life < 0.5 ? q.life * 2 : 1;
      ctx.fillStyle = q.col;
      if (q.kind === 0) {
        ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
      } else {
        var c = Math.cos(q.rot), sn = Math.sin(q.rot), fl = Math.cos(q.rot * 1.7);
        ctx.setTransform(c * fl, sn * fl, -sn, c, q.x, q.y);
        ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / 2);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
    }
    ctx.globalAlpha = 1;

    // objectif : la rangée d'étoiles à remplir
    if (state !== 'start') {
      ctx.fillStyle = 'rgba(0,0,30,0.35)';
      rr(slotX(0) - 70, SLOT_Y - 62, slotX(GOAL - 1) - slotX(0) + 140, 124, 62); ctx.fill();
      for (i = 0; i < GOAL; i++) {
        if (slotFilled[i]) {
          var pop = slotPop[i] > 0 ? 1 + Math.sin((slotPop[i] / 0.35) * Math.PI) * 0.4 : 1;
          drawSprite(starSprites[slotCol[i]], slotX(i), SLOT_Y, 0, 0.64 * pop);
        } else {
          drawSprite(emptySlot, slotX(i), SLOT_Y, 0, 1);
        }
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // aides : flèches au début, puis flèche vers l'étoile la plus basse si on n'attrape plus rien
    if (playing) {
      var pulse = 1 + Math.sin(T * 6) * 0.12;
      if (!taught) {
        drawArrow(robot.x - 250, 780, -1, pulse);
        drawArrow(robot.x + 250, 780, 1, pulse);
      } else if (sinceCatch > 5) {
        var best = null;
        for (i = 0; i < STAR_MAX; i++) {
          var t = stars[i];
          if (t.on && t.y > 80 && t.y < CATCH_BOT && (!best || t.y > best.y)) best = t;
        }
        if (best) {
          var dx = best.x - robot.x;
          ctx.strokeStyle = 'rgba(255,225,77,0.9)'; ctx.lineWidth = 8;
          ctx.beginPath(); ctx.arc(best.x, best.y, 95 + Math.sin(T * 8) * 10, 0, Math.PI * 2); ctx.stroke();
          if (Math.abs(dx) > CATCH_DX - 10) drawArrow(robot.x + (dx > 0 ? 250 : -250), 780, dx > 0 ? 1 : -1, pulse);
        }
      }
    }
  }

  /* ================================================================
     Écrans et sélection (une seule profondeur de menu)
     ================================================================ */
  var screens = { start: $('start'), win: $('win') };
  var homeCorner = $('home');
  var curButtons = [], sel = 0;

  function showScreen(name) {
    for (var k in screens) if (screens.hasOwnProperty(k)) screens[k].classList.toggle('on', k === name);
    curButtons = name ? Array.prototype.slice.call(screens[name].querySelectorAll('.btn')) : [];
    sel = 0;
    paintSel();
    homeCorner.classList.toggle('on', !name);
  }
  function paintSel() { for (var i = 0; i < curButtons.length; i++) curButtons[i].classList.toggle('sel', i === sel); }
  function moveSel(d) {
    if (!curButtons.length) return;
    var n = clamp(sel + d, 0, curButtons.length - 1);
    if (n !== sel) { sel = n; paintSel(); sfxSelect(); }
  }
  function activate(action) {
    var t = now();
    if (t < actLock) return;
    actLock = t + 500;
    sfxConfirm();
    if (action === 'play' || action === 'again') startGame();
    else if (action === 'home') goHome();
  }

  // Boutons : survol du pointeur = sélection, clic = activation
  var allBtns = document.querySelectorAll('.btn');
  Array.prototype.forEach.call(allBtns, function (el) {
    el.addEventListener('mouseenter', function () {
      var idx = curButtons.indexOf(el);
      if (idx >= 0 && idx !== sel) { sel = idx; paintSel(); }
    });
    el.addEventListener('click', function (e) { e.stopPropagation(); initAudio(); activate(el.getAttribute('data-action')); });
  });
  homeCorner.addEventListener('click', function (e) { e.stopPropagation(); if (state !== 'start') activate('home'); });
  muteBtn.addEventListener('click', function (e) { e.stopPropagation(); initAudio(); toggleMute(); });

  // Clic ailleurs pendant le jeu (OK en mode pointeur) : le robot saute de joie
  stage.addEventListener('click', function () { initAudio(); if (state === 'play') hop(); });

  // Le pointeur pilote le robot
  window.addEventListener('mousemove', function (e) {
    if (state !== 'play') return;
    setLaneFromX((e.clientX - offX) / scale);
  });

  /* ================================================================
     Clavier / télécommande
     ================================================================ */
  function keyOf(e) {
    var k = e.key, c = e.keyCode;
    if (k === 'ArrowLeft' || k === 'Left' || c === 37) return 'left';
    if (k === 'ArrowRight' || k === 'Right' || c === 39) return 'right';
    if (k === 'ArrowUp' || k === 'Up' || c === 38) return 'up';
    if (k === 'ArrowDown' || k === 'Down' || c === 40) return 'down';
    if (k === 'Enter' || k === ' ' || k === 'Spacebar' || k === 'Select' || c === 13 || c === 32) return 'ok';
    if (k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack' ||
        c === 27 || c === 8 || c === 461 || c === 10009) return 'back';
    if (k === 'm' || k === 'M' || k === 'ColorF0Red' || c === 403) return 'mute';
    return null;
  }

  window.addEventListener('keydown', function (e) {
    initAudio();
    var k = keyOf(e);
    if (!k) return;
    // Sur l'accueil, « retour » est laissé à la télé (quitter l'appli)
    if (k === 'back' && state === 'start') return;
    e.preventDefault();

    if (k === 'mute') { if (!e.repeat) toggleMute(); return; }

    if (state === 'play') {
      if (k === 'left') moveLane(-1, e.repeat);
      else if (k === 'right') moveLane(1, e.repeat);
      else if (k === 'ok') { if (!e.repeat) hop(); }
      else if (k === 'back') activate('home');
      return;
    }
    if (state === 'celebrate') {
      if (k === 'back') activate('home');
      return;
    }
    // menus (accueil / victoire)
    if (k === 'left' || k === 'up') { if (!e.repeat) moveSel(-1); }
    else if (k === 'right' || k === 'down') { if (!e.repeat) moveSel(1); }
    else if (k === 'ok') { if (!e.repeat && curButtons[sel]) activate(curButtons[sel].getAttribute('data-action')); }
    else if (k === 'back') activate('home');
  });

  // Premier geste = déblocage du son ; pas de menu contextuel, pas de sélection, pas de défilement
  window.addEventListener('mousedown', function (e) { initAudio(); e.preventDefault(); });
  window.addEventListener('touchstart', function () { initAudio(); }, { passive: true });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });

  /* ================================================================
     Boucle : pas fixe 1/60 s, pause quand l'onglet est caché
     ================================================================ */
  var acc = 0, last = 0, running = !document.hidden, resetClock = true;

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      running = false;
      if (AC && AC.state === 'running') { try { AC.suspend(); } catch (e) { /* rien */ } }
    } else {
      running = true;
      resetClock = true;                 // pas de saut de temps au retour
      if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* rien */ } }
    }
  });

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!running) return;
    if (resetClock) { last = ts; acc = 0; resetClock = false; }
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt < 0) dt = 0;
    if (dt > 0.25) dt = 0.25;            // évite la « spirale » après un gros ralentissement
    acc += dt;
    var n = 0;
    while (acc >= STEP && n < 8) { update(STEP); acc -= STEP; n++; }
    if (n === 8) acc = 0;
    render();
  }

  showScreen('start');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
